  });

  /* ---- SPPG dari rekap pendaftaran (tanpa NPP / belum ada di laporan) ---- */
  var perLabel = {};
  units.forEach(function (u) { (perLabel[norm(u.label)] = perLabel[norm(u.label)] || []).push(u); });
  var cariUnit = function (ub) {
    var kand = perLabel[norm(labelBebas(ub.nama).label)] || [];
    var sama = kand.filter(function (u) { return norm(u.kecamatan) === norm(ub.kecamatan); });
    if (sama.length === 1) return sama[0];
    if (!ub.kecamatan && kand.length === 1) return kand[0];
    if (sama.length > 1 && ub.yayasan) return sama.filter(function (u) { return kunciYayasan(u.yayasan) === kunciYayasan(ub.yayasan); })[0] || null;
    return null;
  };
  var manual = [];
  Object.keys(DB.unit).forEach(function (id) {
    var ub = DB.unit[id];
    if (!ub.manual) return;
    var cocok = null;
    if (ub.npp) ub.npp.forEach(function (n) { units.forEach(function (u) { if (u.npps.some(function (x) { return x.npp === n; })) cocok = u; }); });
    if (!cocok) cocok = cariUnit(ub);
    if (cocok) {
      // sudah muncul di laporan iuran: kontak dari rekap dipakai bila SPPG itu belum punya
      if (!cocok.pic.nama && ub.picNama) { cocok.pic.nama = ub.picNama; cocok.pic.sumber = 'rekap pendaftaran'; }
      if (!cocok.pic.wa && hpSeluler(ub.picWa)) { cocok.pic.wa = hpSeluler(ub.picWa); cocok.pic.waTampil = hpTampil(ub.picWa); }
      if (!cocok.yayasan && ub.yayasan) cocok.yayasan = ub.yayasan;
      return;
    }
    var logs = (logPerUnit[id] || []).slice().sort(function (a, b) { return a.waktu < b.waktu ? 1 : -1; });
    manual.push({ id: id, manual: true, label: ub.nama, yayasan: ub.yayasan || '', kecamatan: ub.kecamatan || '', desa: ub.desa || '', status: ub.status || 'Belum terdaftar',

  });

    menunggakSppg: units.filter(function (u) { return u.koef >= 2; }).length, menunggakNpp: npps.filter(function (o) { return o.n >= 2; }).length,
    tunggakan: units.reduce(function (s, u) { return s + u.tunggakan; }, 0), tk: units.reduce(function (s, u) { return s + u.tk; }, 0),
    tkMenunggak: units.filter(function (u) { return u.koef >= 2; }).reduce(function (s, u) { return s + u.tk; }, 0)
  };

  // peringatan data
  var peringatan = [];
  if (periodeMaks && periodeMin && selisihHari(periodeMin, periodeMaks) > 7) {
    var lama = units.filter(function (u) { return selisihHari(u.periode, periodeMaks) > 7; }).length;
    peringatan.push(lama + ' SPPG datanya lebih lama (per ' + tglSedang(periodeMin) + ') dari data terbaru (' + tglSedang(periodeMaks) + '). Impor laporan terbaru untuk semua pembina.');
  }

/** NAMA ORANG DARI LAPORAN → Nama Orang; nama yang sudah berhuruf campur dibiarkan. */
function judulNama(s) {
  var t = String(s || '').replace(/\s+/g, ' ').trim();

/* ---------------- urutan & saringan ---------------- */

function urutTidakPatuh(a, b) {
  return (b.koef - a.koef) || (b.tunggakan - a.tunggakan) || ((a.itb ? 1 : 0) - (b.itb ? 1 : 0)) || (a.label < b.label ? -1 : 1);
}
function urutPatuh(a, b) {
  return ((b.itb ? 1 : 0) - (a.itb ? 1 : 0)) || (a.koef - b.koef) || ((a.tglBayar || '9') < (b.tglBayar || '9') ? -1 : (a.tglBayar || '9') > (b.tglBayar || '9') ? 1 : 0) ||
    (a.label < b.label ? -1 : 1);
}

function cocokCari(u, q) {
  if (!q) return true;
  var t = norm([u.label, u.yayasan, u.kecamatan, u.namaResmi, u.pic && u.pic.nama, (u.npps || []).map(function (x) { return x.npp; }).join(' ')].join(' '));
  return norm(q).split(' ').every(function (k) { return t.indexOf(k) >= 0; });
}

/** Rekap per kecamatan / yayasan / pembina. */
function rekapPer(units, kunciFn, labelFn) {
  var g = {};
  units.forEach(function (u) {
    var k = kunciFn(u) || '—';
    var x = g[k] = g[k] || { kunci: k, label: labelFn ? labelFn(u) || '—' : k, units: [], tepat: 0, lalu: 0, menunggak: 0, tunggakan: 0 };
    x.units.push(u);
    if (u.itb) x.tepat++; else if (u.koef <= 1) x.lalu++; else x.menunggak++;
    x.tunggakan += u.tunggakan;
  });
  return Object.keys(g).map(function (k) { return g[k]; });
}

/** Keadaan per tanggal data (untuk grafik tren bulan berjalan). */
function trenBulanIni(model) {
  var tanggal = {};
  DB.snap.forEach(function (s) { if ((s.jenis === 'ITW_ITB' || s.jenis === 'MONITORING') && s.periode.slice(0, 7) === model.bulanIni) tanggal[s.periode] = true; });
  return Object.keys(tanggal).sort().map(function (t) {
    var m = hitung({ sampai: t });
    return { tanggal: t, tepat: m.rekap.itbSppg, itw: m.rekap.itwSppg, sppg: m.rekap.sppg, menunggak: m.rekap.menunggakSppg };
  });
}

/** SPPG yang baru tepat bulan sejak laporan grup terakhir yang ditandai terkirim. */
function baruBayarSejak(model) {
  var lap = DB.laporan.filter(function (l) { return l.jenis === 'iuran'; }).slice(-1)[0];
  if (!lap) return { laporan: null, units: [] };
  return {
    laporan: lap,
    units: model.units.filter(function (u) { var p = lap.peta[u.id]; return u.itb && p && p.k !== 'tepat'; }).sort(function (a, b) { return (a.tglBayar || '') < (b.tglBayar || '') ? -1 : 1; })
  };
}

/* ---------------- rincian tunggakan per NPP (format Rincian Tagihan, sama dengan LENSA PK) ---------------- */
function bulat2(n) { return Math.round((+n || 0) * 100) / 100; }
function angka2(n) {
  var s = (Math.round((+n || 0) * 100) / 100).toFixed(2).split('.');
  return s[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + s[1];
}
function umurTeks(u) { return u === 0 ? '-' : String(u); }

/** Sama dengan tebakNonAsn_ LENSA PK: pemberi kerja non-badan usaha (mis. relawan SPPG, skala MI) tanpa denda. */
function nonAsn(nama, skala) {
  var n = ' ' + String(nama || '').toUpperCase().replace(/[^A-Z0-9]+/g, ' ') + ' ';
  if (String(skala || '').trim() === 'MI') return true;
  if (/ (PT|CV|UD|PDAM|PERUMDA|PERUMDAM|PERSERODA|BUMD|BUMN|BUMDES|BANK|BPR|KOPERASI|KOP|KLINIK|PMI|APOTEK) /.test(n)) return false;
  if (/ NON ASN | K2 | HONORER | TENAGA KONTRAK | TENAGA PENDUKUNG | TENAGA HARIAN LEPAS | THL | PTT | PPPK | TKS | GTT | PEGAWAI TIDAK TETAP | GURU TIDAK TETAP /.test(n)) return true;
  if (/ (APARAT|APARATUR|PERANGKAT) (PEMERINTAH |PEMRINTAH )?DESA | PEMDES | BPD | BADAN PERMUSYAWARATAN | KADER | PKK | POSYANDU | KPM | LEMBAGA ADAT | RT RW | RUKUN TETANGGA | RUKUN WARGA | LINMAS | RELAWAN SPPG | PETUGAS SENSUS | KPPS | PANTARLIH /.test(n)) return true;
  return false;
}

/** Iuran + denda yang belum dibayar sampai bulan berjalan (rumus LENSA PK: denda 2% × umur, maks. 12 bulan; non-badan usaha tanpa denda). */
function rincianNpp(o, model) {
  var M0 = model.M0, bp = o.bp ? mIdx(o.bp) : (o.bln !== null && o.bln !== undefined ? M0 - o.bln : null);
  if (bp === null || bp >= M0) return null;
  var dendaOn = !nonAsn(o.nama, o.skala), rows = [];
  var t = { tagihan: 0, dibayar: 0, piutang: 0, denda: 0, dendaDibayar: 0, dendaPiutang: 0, jumlah: 0 };
  for (var M = Math.max(bp + 1, M0 - 59); M <= M0; M++) {
    var umur = M0 - M - 1, tag = bulat2(o.iuran);
    var den = dendaOn ? bulat2(tag * Math.min(Math.max(umur, 0), 12) * 0.02) : 0;
    var b = blthDariIdx(M);
    rows.push({ periode: b.slice(5, 7) + '-' + b.slice(0, 4), umur: umur, tagihan: tag, dibayar: 0, piutang: tag, denda: den, dendaDibayar: 0, dendaPiutang: den, jumlah: bulat2(tag + den) });
    t.tagihan += tag; t.piutang += tag; t.denda += den; t.dendaPiutang += den; t.jumlah += bulat2(tag + den);
  }
  Object.keys(t).forEach(function (k) { t[k] = bulat2(t[k]); });
  var ibr = bulat2(o.ibrN), sisa = bulat2(t.jumlah - ibr), bi = blthDariIdx(M0);
  return { periode: bi.slice(5, 7) + '/' + bi.slice(0, 4), rows: rows, total: t, ibr: ibr, totalTagihan: Math.max(0, sisa), lebih: sisa < 0 ? -sisa : 0, dendaOn: dendaOn };
}


/* === 45-analisa.js === */
/* ----------------------------------------------------------------------
 *  Analisa untuk dasbor: riwayat tanggal bayar, kurva bulan ini vs lalu,
 *  proyeksi, tren 6 bulan, perpindahan status, risiko bulan depan,
 *  sebaran hari bayar, efektivitas WA, peringkat pembina, SPPG baru, IBR.
 * ---------------------------------------------------------------------- */

var _riwayat = { kunci: '', peta: null };

/**
 * Riwayat bayar per NPP: [{ bp, tgl, kira }] — bp = bulan iuran terakhir yang terposting,
 * tgl = tanggal bayar (Monitoring); bila hanya ada ITW/ITB, tanggal = tanggal laporan pertama
 * yang memperlihatkan bp itu (kira = true, perkiraan paling lambat).
 */
function riwayatBayar() {
  var kunci = DB.snap.length + '|' + DB.snap.map(function (s) { return s.id; }).join(',');
  if (_riwayat.kunci === kunci) return _riwayat.peta;
  var peta = {}, tambah = function (npp, bp, tgl, kira) {
    if (!bp || !tgl) return;
    var a = peta[npp] = peta[npp] || [];
    for (var i = 0; i < a.length; i++) {
      if (a[i].bp === bp) { if (a[i].kira && !kira) { a[i].tgl = tgl; a[i].kira = false; } else if (a[i].kira === kira && tgl < a[i].tgl) a[i].tgl = tgl; return; }
    }
    a.push({ bp: bp, tgl: tgl, kira: kira });
  };
  var snaps = DB.snap.slice().sort(function (a, b) { return a.periode < b.periode ? -1 : 1; });
  snaps.forEach(function (s) {
    if (s.jenis === 'MONITORING') s.rows.forEach(function (r) { if (r.bp && r.tgl) tambah(r.npp, r.bp, r.tgl, false); });
  });
  snaps.forEach(function (s) {
    if (s.jenis === 'ITW_ITB') s.rows.forEach(function (r) { if (r.bp) tambah(r.npp, r.bp, s.periode, true); });
  });
  _riwayat = { kunci: kunci, peta: peta };
  return peta;
}

/** Tanggal paling awal NPP ini tercatat sudah membayar iuran bulan X ('' bila belum diketahui). */
function tglBayarBulan(npp, X) {
  var a = riwayatBayar()[npp] || [], ix = mIdx(X), t = '';
  a.forEach(function (e) { if (mIdx(e.bp) >= ix && (!t || e.tgl < t)) t = e.tgl; });
  return t;
}

/** Tanggal SPPG (semua NPP-nya) lunas iuran bulan X. */
function tglBayarUnit(u, X) {
  var t = '';
  for (var i = 0; i < u.npps.length; i++) {
    var d = tglBayarBulan(u.npps[i].npp, X);
    if (!d) return '';
    if (d > t) t = d;
  }
  return t;
}

/** Kurva kumulatif: berapa SPPG sudah bayar iuran bulan X di dalam bulan X, per tanggal. */
function kurvaBulan(model, X, sampaiHari) {
  var n = hariDalamBulan(X), per = [], tgl = {};
  for (var d = 0; d <= n; d++) per.push(0);
  model.units.forEach(function (u) {
    var t = tglBayarUnit(u, X);
    if (t && t.slice(0, 7) === X) { per[+t.slice(8)]++; tgl[u.id] = t; }
  });
  var kum = [], s = 0, batas = sampaiHari || n;
  for (var k = 1; k <= Math.min(n, batas); k++) { s += per[k]; kum.push(s); }
  return { bulan: X, hari: n, kum: kum, total: model.units.length, tgl: tgl };
}

function kurvaDuaBulan(model) {
  var hariData = model.dataPer.akhir && model.dataPer.akhir.slice(0, 7) === model.bulanIni ? +model.dataPer.akhir.slice(8) : (model.hariIni.slice(0, 7) === model.bulanIni ? +model.hariIni.slice(8) : hariDalamBulan(model.bulanIni));
  var ini = kurvaBulan(model, model.bulanIni, hariData);
  var lalu = kurvaBulan(model, blthDariIdx(model.M0 - 1));
  var sekarang = ini.kum.length ? ini.kum[ini.kum.length - 1] : 0;
  var laluSaatIni = lalu.kum[Math.min(hariData, lalu.kum.length) - 1] || 0, laluAkhir = lalu.kum[lalu.kum.length - 1] || 0;
  // proyeksi: tambahan pembayaran bulan lalu dari tanggal yang sama sampai akhir bulan, ditambahkan ke angka sekarang
  var proyeksi = laluAkhir > 0 ? Math.min(model.units.length, sekarang + (laluAkhir - laluSaatIni)) : null;
  var target = +DB.pengaturan.targetItb || 0, targetN = target ? Math.ceil(target / 100 * model.units.length) : 0;
  return { ini: ini, lalu: lalu, hariData: hariData, sekarang: sekarang, laluSaatIni: laluSaatIni, laluAkhir: laluAkhir, proyeksi: proyeksi, target: target, targetN: targetN, kurang: targetN ? Math.max(0, targetN - sekarang) : 0 };
}

/** Tanggal-tanggal data (ITW/Monitoring) yang tersimpan, urut naik. */
function tanggalData() {
  var t = {};
  DB.snap.forEach(function (s) { if (s.jenis === 'ITW_ITB' || s.jenis === 'MONITORING') t[s.periode] = true; });
  return Object.keys(t).sort();
}

/** Tren 6 bulan: % ITB & ITW SPPG memakai laporan terakhir di tiap bulan. */
function tren6Bulan(model) {
  var td = tanggalData(), out = [];
  for (var i = model.M0 - 5; i <= model.M0; i++) {
    var b = blthDariIdx(i), dlm = td.filter(function (t) { return t.slice(0, 7) === b; });
    if (!dlm.length) continue;
    var akhir = dlm[dlm.length - 1], m = i === model.M0 ? model : hitung({ sampai: akhir });
    if (!m.rekap.sppg) continue;
    out.push({ bulan: b, tanggal: akhir, itb: persen(m.rekap.itbSppg, m.rekap.sppg), itw: persen(m.rekap.itwSppg, m.rekap.sppg), sppg: m.rekap.sppg,
      menunggak: m.rekap.menunggakSppg, berjalan: i === model.M0, sebagian: i !== model.M0 && +akhir.slice(8) < hariDalamBulan(b) - 2 });
  }
  return out;
}

function grupStatus(u) { return u.itb ? 0 : u.koef <= 1 ? 1 : u.koef <= 3 ? 2 : 3; }
var LABEL_GRUP = ['Tepat bulan', 'Bulan lalu', 'Menunggak 2–3 bln', 'Menunggak 4 bln+'];

/** Perpindahan status antara data per tanggal `dari` dan data sekarang. */
function perpindahan(model, dari) {
  if (!dari) return null;
  var lama = hitung({ sampai: dari }), petaLama = {};
  lama.units.forEach(function (u) { petaLama[u.id] = u; });
  var mat = [[], [], [], []], membaik = [], tetap = [], memburuk = [];
  for (var a = 0; a < 4; a++) for (var b = 0; b < 4; b++) mat[a][b] = [];
  model.units.forEach(function (u) {
    var l = petaLama[u.id];
    if (!l) return;
    var ga = grupStatus(l), gb = grupStatus(u);
    mat[ga][gb].push(u.id);
    // membaik = kategori atau bulan menunggak berkurang (dalam bulan yang sama), memburuk = bertambah
    var skorL = l.itb ? -1 : l.koef, skorB = u.itb ? -1 : u.koef;
    var geser = model.M0 - lama.M0; // pergantian bulan: koef lama otomatis +geser
    if (skorL >= 0) skorL += geser; else if (geser > 0) skorL = geser;
    if (skorB < skorL) membaik.push(u.id); else if (skorB > skorL) memburuk.push(u.id); else tetap.push(u.id);
  });
  return { dari: dari, mat: mat, membaik: membaik, tetap: tetap, memburuk: memburuk, ada: membaik.length + tetap.length + memburuk.length };
}

/** Pilihan pembanding: tanggal data sebelumnya, awal bulan, laporan grup terakhir. */
function pilihanPembanding(model) {
  var td = tanggalData().filter(function (t) { return t < (model.dataPer.akhir || '9999'); }), out = [];
  if (td.length) out.push({ t: td[td.length - 1], label: 'Data sebelumnya (' + tglPendek(td[td.length - 1]) + ')' });
  var awal = td.filter(function (t) { return t.slice(0, 7) === model.bulanIni; })[0];
  if (awal && awal !== (out[0] || {}).t) out.push({ t: awal, label: 'Awal bulan (' + tglPendek(awal) + ')' });
  var bl = td.filter(function (t) { return t.slice(0, 7) === blthDariIdx(model.M0 - 1); }).pop();
  if (bl) out.push({ t: bl, label: 'Akhir bulan lalu (' + tglPendek(bl) + ')' });
  var lap = DB.laporan.filter(function (l) { return l.jenis === 'iuran' && l.dataPer && l.dataPer < (model.dataPer.akhir || '9999'); }).pop();
  if (lap && !out.some(function (o) { return o.t === lap.dataPer; })) out.push({ t: lap.dataPer, label: 'Laporan grup terakhir (' + tglPendek(lap.dataPer) + ')' });
  td.slice(0, -1).reverse().forEach(function (t) { if (!out.some(function (o) { return o.t === t; })) out.push({ t: t, label: tglSedang(t) }); });
  return out;
}

/** Bila belum ada pembayaran sampai awal bulan depan. */
function risikoBulanDepan(model) {
  var naik = model.units.filter(function (u) { return !u.itb && u.koef + 1 >= 2; });
  var baruMenunggak = naik.filter(function (u) { return u.koef <= 1; });
  return {
    bulan: blthDariIdx(model.M0 + 1),
    sppgKini: model.rekap.menunggakSppg, sppgNanti: naik.length,
    tkKini: model.rekap.tkMenunggak, tkNanti: naik.reduce(function (s, u) { return s + u.tk; }, 0),
    terutangKini: model.rekap.tunggakan, terutangNanti: model.units.reduce(function (s, u) { return s + u.tagihan; }, 0),
    baru: baruMenunggak, naik: naik
  };
}

/** Pekerja & iuran terutang per lama tunggakan (SPPG menunggak ≥ 2 bulan). */
function perLamaTunggakan(model) {
  var g = {};
  model.units.forEach(function (u) {
    if (u.koef < 2) return;
    var x = g[u.koef] = g[u.koef] || { n: u.koef, units: [], tk: 0, terutang: 0 };
    x.units.push(u); x.tk += u.tk; x.terutang += u.tunggakan;
  });
  return Object.keys(g).map(Number).sort(function (a, b) { return a - b; }).map(function (k) { return g[k]; });
}

var KELOMPOK_HARI = [[1, 5], [6, 10], [11, 15], [16, 20], [21, 25], [26, 31]];
/** Kapan SPPG membayar: bulan lalu (bila cukup data), selain itu bulan ini. */
function sebaranHariBayar(model) {
  var pilih = function (X) {
    var k = kurvaBulan(model, X), ember = KELOMPOK_HARI.map(function (r) { return { dari: r[0], sampai: r[1], ids: [] }; });
    Object.keys(k.tgl).forEach(function (id) {
      var d = +k.tgl[id].slice(8);
      for (var i = 0; i < ember.length; i++) if (d >= ember[i].dari && d <= ember[i].sampai) { ember[i].ids.push(id); break; }
    });
    return { bulan: X, ember: ember, n: Object.keys(k.tgl).length };
  };
  var lalu = pilih(blthDariIdx(model.M0 - 1));
  return lalu.n >= 5 ? lalu : pilih(model.bulanIni);
}

/** Efektivitas pesan WA per templat: bayar ≤ 7 hari setelah pesan, janji ditepati. */
function efektivitasWa(model) {
  var unitById = {}, g = {};
  model.units.forEach(function (u) { unitById[u.id] = u; });
  var bayarSetelah = function (u, dari) {
    var t = '';
    u.npps.forEach(function (o) {
      (riwayatBayar()[o.npp] || []).forEach(function (e) { if (!e.kira && e.tgl >= dari && (!t || e.tgl < t)) t = e.tgl; });
    });
    if (!t && u.bayarSetelahWa) t = 'ya';
    return t;
  };
  DB.log.forEach(function (l) {
    var u = unitById[l.unit];
    if (!u || l.hasil === 'Nomor salah') return;
    var k = l.templat || 'Tanpa templat (catatan manual)';
    var x = g[k] = g[k] || { templat: k, kirim: 0, bayar7: 0, janji: 0, ditepati: 0, lewat: 0, idsBayar: [], idsLewat: [] };
    x.kirim++;
    var t = bayarSetelah(u, l.tanggal);
    if (t && (t === 'ya' || selisihHari(l.tanggal, t) <= 7)) { x.bayar7++; x.idsBayar.push(u.id); }
    if (l.janji) {
      x.janji++;
      if (t && (t === 'ya' || t <= l.janji)) x.ditepati++;
      else if (l.janji < hariIni()) { x.lewat++; x.idsLewat.push(u.id); }
    }
  });
  return Object.keys(g).map(function (k) { return g[k]; }).sort(function (a, b) { return b.kirim - a.kirim; });
}

/** Peringkat per pembina (se-KC). */
function rekapPembina(model) {
  var g = {};
  model.units.forEach(function (u) {
    var k = (u.pembina || '').split(', ')[0] || 'Tanpa kode pembina';
    var x = g[k] = g[k] || { pembina: k, units: [], itb: 0, itw: 0, menunggak: 0, tunggakan: 0, tk: 0, dataPer: '' };
    x.units.push(u);
    if (u.itb) x.itb++;
    if (u.itw) x.itw++;
    if (u.koef >= 2) x.menunggak++;
    x.tunggakan += u.tunggakan; x.tk += u.tk;
    if (!x.dataPer || u.periode < x.dataPer) x.dataPer = u.periode;
  });
  return Object.keys(g).map(function (k) { var x = g[k]; x.pItb = persen(x.itb, x.units.length); x.pItw = persen(x.itw, x.units.length); return x; })
    .sort(function (a, b) { return (b.pItw - a.pItw) || (b.pItb - a.pItb) || (a.pembina < b.pembina ? -1 : 1); });
}

/** Perlu perhatian: SPPG baru, IBR belum dirinci, janji jatuh tempo, tanpa nomor WA. */
function perluPerhatian(model) {
  var batasBaru = blthDariIdx(model.M0 - 3);
  return {
    baru: model.units.filter(function (u) { return u.keps && u.keps >= batasBaru; }),
    setor: model.manual.filter(function (u) { return u.status === 'Sudah setor data'; }),
    ibr: model.units.filter(function (u) { return u.ibr; }),
    janji: model.units.filter(function (u) { return u.janji && u.janji <= hariIni(); }),
    tanpaWa: model.units.filter(function (u) { return !u.pic.wa; })
  };
}

/* === 50-teks.js === */
/* ----------------------------------------------------------------------
 *  Teks: pesan WA ke PIC dan pesan laporan harian ke grup WA.
 * ---------------------------------------------------------------------- */

function templatById(id) { return DB.pengaturan.templatWa.filter(function (t) { return t.id === id; })[0] || DB.pengaturan.templatWa[0]; }

function namaSppg(u) { return 'SPPG ' + u.label; }
function batasTgl(model) { return tglSedang(model.bulanIni + '-' + pad2(Math.min(+DB.pengaturan.batas || 15, hariDalamBulan(model.bulanIni)))); }

function rentangBulanBelum(o, M0) {
  if (o.koef <= 0) return '';
  var dari = blthDariIdx(M0 - o.koef + 1), sampai = blthDariIdx(M0);
  if (dari === sampai) return namaBulan(sampai) + ' (1 bulan)';
  var a = dari.slice(0, 4) === sampai.slice(0, 4) ? namaBulanSaja(dari) : namaBulan(dari);
  return a + ' – ' + namaBulan(sampai) + ' (' + o.koef + ' bulan)';
}

/** Rincian per NPP — format teks sama dengan pesan Rincian tagihan LENSA PK. */
function teksRincian(u, model) {
  var blok = u.npps.filter(function (o) { return o.rinci; }).map(function (o) {
    var r = o.rinci, L = ['📌 *' + o.nama + '*', 'NPP/Div: ' + o.npp + ' / ' + (o.div || '000') + ' · Periode ' + r.periode];
    r.rows.forEach(function (x, i) {
      L.push((i + 1) + ') ' + x.periode + ': Rp ' + angka2(x.tagihan) + (x.denda ? ' + denda Rp ' + angka2(x.denda) + ' (2% × ' + Math.min(x.umur, 12) + ')' : ''));
    });
    L.push('Total iuran: Rp ' + angka2(r.total.piutang));
    if (r.dendaOn) L.push('Total denda: Rp ' + angka2(r.total.dendaPiutang));
    if (r.ibr) L.push('Sisa iuran belum rinci (IBR): − Rp ' + angka2(r.ibr));
    L.push('💰 *Total tagihan: Rp ' + angka2(r.totalTagihan) + '*' + (r.lebih ? ' (saldo IBR lebih Rp ' + angka2(r.lebih) + ')' : ''));
    if (o.kodeIuran) L.push('🔑 Kode iuran: *' + o.kodeIuran + '*');
    return L.join('\n');
  });
  if (!blok.length) return '';
  var tanpaDenda = u.npps.some(function (o) { return o.rinci && !o.rinci.dendaOn; });
  return blok.join('\n\n') + '\n\n_Dihitung dari iuran bulan terakhir; perubahan upah atau mutasi TK dihitung kemudian. Denda 2% per bulan keterlambatan (maks. 12 bulan)' +
    (tanpaDenda ? ', tidak berlaku untuk pemberi kerja non-badan usaha' : '') + '._';
}

function teksDaftarNpp(u) {
  return u.npps.map(function (o) {
    return '📌 *' + o.jenisTampil + '* · NPP ' + o.npp + (o.iuran ? '\n   Iuran per bulan ± ' + rupiah(o.iuran) : '') + (o.kodeIuran ? '\n   🔑 Kode iuran: ' + o.kodeIuran : '');
  }).join('\n\n');
}

/** Pesan WA untuk satu SPPG. Mengembalikan '' bila templat tagihan dan SPPG ini sudah lunas. */
function isiPesanWa(templat, u, model) {
  var isi = String(templat.isi || '');
  if (/\{rincian\}|\{total\}/.test(isi) && !(u.tagihan > 0)) return '';
  var pgt = DB.pengaturan, picNama = u.pic && u.pic.nama ? u.pic.nama : '';
  return isi
    .replace(/\{salam\}/g, salamWaktu())
    .replace(/Bapak\/Ibu \{nama_pic\}/g, u.sapaan ? u.sapaan : picNama ? 'Bapak/Ibu ' + picNama : 'Bapak/Ibu')
    .replace(/\{nama_pic\}/g, picNama || 'Bapak/Ibu')
    .replace(/\{sppg\}/g, namaSppg(u))
    .replace(/ \(\{yayasan\}\)/g, u.yayasan ? ' (Yayasan ' + u.yayasan + ')' : '')
    .replace(/\{yayasan\}/g, u.yayasan || '')
    .replace(/\{rincian\}/g, u.npps ? teksRincian(u, model) : '')
    .replace(/\{daftar_npp\}/g, u.npps ? teksDaftarNpp(u) : '')
    .replace(/\{total\}/g, 'Rp ' + angka2(u.tagihan || 0))
    .replace(/\{bulan\}/g, namaBulan(model.bulanIni))
    .replace(/\{bulan_lalu\}/g, namaBulan(blthDariIdx(model.M0 - 1)))
    .replace(/\{batas\}/g, batasTgl(model))
    .replace(/\{tanggal_data\}/g, tglSedang(u.periode || model.dataPer.akhir || hariIni()))
    .replace(/\{petugas\}/g, pgt.petugas || 'Petugas BPJS Ketenagakerjaan')
    .replace(/\{kantor\}/g, pgt.kantor || '');
}

function satuanTeks(nNpp, nSppg) {
  var s = DB.pengaturan.satuan;
  if (s === 'npp') return nNpp + ' NPP';
  if (s === 'sppg') return nSppg + ' SPPG';
  return nNpp + ' NPP / ' + nSppg + ' SPPG';
}

function teksRekapIuran(model) {
  var M0 = model.M0, baris = ['💳 *Rekap Pembayaran Iuran* :', ''];
  model.rekap.kats.forEach(function (k) {
    var jml = satuanTeks(k.npp, k.sppg);
    if (k.k === 'tepat') baris.push('💥 ' + jml + ': Bayar Tepat Bulan (' + namaBulanKutip(model.bulanIni) + ') – APRESIASI SETINGGI-TINGGINYA! 👍');
    else if (k.k === 'lalu') baris.push('⚠️ ' + jml + ': masih bulan ' + namaBulanKutip(blthDariIdx(M0 - 1)) + '.');
    else baris.push('🚨 ' + jml + ': Menunggak ' + k.urut + ' bulan (' + namaBulanKutip(k.terbayar) + ').');
    baris.push('');
  });
  return baris.join('\n') + '\n';
}

function teksRekapDaftar(model) {
  var d = model.daftar;
  return ['📊 *Rekap Pendaftaran* :', '',
    '✅ ' + d.aktif + ' SPPG: Terdaftar Aktif' + (d.total && d.aktif >= d.total * 0.9 ? ' (Luar Biasa!)' : ''), '',
    '⏳ ' + d.setor.length + ' SPPG: Sudah setor data, ditunggu pembayaran iuran pertamanya.', '',
    '📌 ' + d.belum.length + ' SPPG: Belum terdaftar.', '', ''].join('\n');
}

function namaDenganPic(u) {
  return namaSppg(u) + (u.yayasan ? ' – ' + u.yayasan : '') + (u.pic && u.pic.nama ? ' (' + u.pic.nama + ')' : '');
}

function teksDaftarNama(model) {
  var ambang = +DB.pengaturan.ambangTeks || 2;
  var pilih = model.units.filter(function (u) { return u.koef >= ambang; }).sort(urutTidakPatuh);
  if (!pilih.length) return '';
  var out = ['📋 *Daftar SPPG menunggak ' + ambang + ' bulan atau lebih* :'];
  var kel = {};
  pilih.forEach(function (u) { (kel[u.koef] = kel[u.koef] || []).push(u); });
  Object.keys(kel).map(Number).sort(function (a, b) { return b - a; }).forEach(function (n) {
    out.push('');
    out.push('🚨 *Menunggak ' + n + ' bulan* (' + namaBulanKutip(blthDariIdx(model.M0 - n)) + ')');
    kel[n].forEach(function (u, i) {
      var bagian = u.npps.filter(function (o) { return o.n >= 2; }).map(function (o) { return o.jenis || o.jenisTampil; });
      var ket = u.npps.length > 1 && bagian.length < u.npps.length ? ' · ' + bagian.join(' & ') : '';
      out.push((i + 1) + '. ' + namaDenganPic(u) + ket);
    });
  });
  return out.join('\n') + '\n\n';
}

function teksBaruBayar(model) {
  var b = baruBayarSejak(model);
  if (!b.laporan || !b.units.length) return '';
  return '🎉 *Terima kasih*, sudah bayar tepat bulan sejak laporan ' + tglSedang(b.laporan.waktu.slice(0, 10)) + ':\n' +
    b.units.map(function (u) { return '• ' + namaDenganPic(u); }).join('\n') + '\n\n';

function teksLaporanGrup(model, opsi) {
  opsi = opsi || {};

    .replace(/\{tanggal_data\}/g, model.dataPer.teks || tglSedang(hariIni()))

function teksLaporanDaftar(model) {
  var d = model.daftar, out = ['Assalamualaikum Wr. Wb.', '', salamWaktu() + ' Bapak/Ibu sekalian.', '',
    'Ijin kami sampaikan Update Pendaftaran Kepesertaan SPPG per ' + tglSedang(DB.daftarPer || hariIni()), '', teksRekapDaftar(model).trim(), ''];

function csvSppg(units, model) {

/* ----------------------------------------------------------------------
 *  Gambar kartu laporan untuk grup WhatsApp (kanvas, lebar 1080 px).
 * ---------------------------------------------------------------------- */

var HURUF = '"Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif';
var KW = 1080, KP = 56; // lebar & tepi

function kanvasBaru(tinggi) {
  var c = document.createElement('canvas');
  c.width = KW; c.height = tinggi;
  var g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, KW, tinggi);
  g.textBaseline = 'alphabetic';
  return { c: c, g: g };
}

function fh(berat, ukuran) { return berat + ' ' + ukuran + 'px ' + HURUF; }

/** Teks dengan pemotongan "…" bila melebihi lebar maksimum. */
function tulis(g, teks, x, y, opsi) {
  opsi = opsi || {};
  g.font = fh(opsi.berat || 400, opsi.ukuran || 24);
  g.fillStyle = opsi.warna || WARNA.teks;
  g.textAlign = opsi.rata || 'left';
  var t = String(teks || '');
  if (opsi.maks) {
    if (g.measureText(t).width > opsi.maks) {
      while (t.length > 1 && g.measureText(t + '…').width > opsi.maks) t = t.slice(0, -1);
      t = t.replace(/\s+$/, '') + '…';
    }
  }
  if (opsi.spasi) { try { g.letterSpacing = opsi.spasi + 'px'; } catch (e) { /* lama */ } }
  g.fillText(t, x, y);
  if (opsi.spasi) { try { g.letterSpacing = '0px'; } catch (e) { /* lama */ } }
  g.textAlign = 'left';
  return g.measureText(t).width;
}

function kotakBulat(g, x, y, w, h, r, warna) {
  g.fillStyle = warna;
  g.beginPath();
  if (g.roundRect) g.roundRect(x, y, w, h, r);
  else { g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
  g.fill();
}

function kepalaKartu(g, label, judul, sub) {
  g.fillStyle = WARNA.biru; g.fillRect(0, 0, KW, 220);
  tulis(g, label, KP, 66, { berat: 700, ukuran: 21, warna: '#DCE3F5', spasi: 2 });
  tulis(g, judul, KP, 132, { berat: 700, ukuran: 54, warna: '#fff', maks: KW - KP * 2 });
  tulis(g, sub, KP, 182, { berat: 400, ukuran: 25, warna: '#DCE3F5', maks: KW - KP * 2 });
  return 220;
}

function kakiKartu(g, y, kiri1, kiri2) {
  var h = 120;
  g.fillStyle = WARNA.latar; g.fillRect(0, y, KW, h);
  tulis(g, kiri1, KP, y + 52, { berat: 700, ukuran: 25, maks: 600 });
  tulis(g, kiri2, KP, y + 88, { ukuran: 21, warna: WARNA.pudar, maks: 600 });
  var pgt = DB.pengaturan;
  tulis(g, pgt.petugas || 'Petugas Pembina', KW - KP, y + 52, { berat: 600, ukuran: 23, rata: 'right', maks: 380 });
  tulis(g, 'BPJS Ketenagakerjaan ' + (pgt.kantor || ''), KW - KP, y + 88, { ukuran: 21, warna: WARNA.pudar, rata: 'right', maks: 380 });
  return y + h;
}

function labelKantor() { return 'UPDATE KEPATUHAN IURAN SPPG · ' + String(DB.pengaturan.kantor || 'KC PAMEKASAN').toUpperCase(); }

/* ---------------- 1. rekap angka ---------------- */
function gambarRekap(model) {
  var r = model.rekap, kats = r.kats, tinggi = 220 + 250 + kats.length * 86 + 90 + 120;
  var k = kanvasBaru(tinggi), g = k.g;
  var y = kepalaKartu(g, labelKantor(), 'Rekap Pembayaran Iuran', 'Data per ' + model.dataPer.teks + ' · ' + r.sppg + ' SPPG · ' + r.npp + ' NPP');

  y += 150;
  var w = tulis(g, String(r.itbSppg), KP, y, { berat: 700, ukuran: 132, warna: WARNA.tepat });
  tulis(g, 'dari ' + r.sppg + ' SPPG tepat bulan', KP + w + 26, y - 56, { berat: 700, ukuran: 37, maks: 560 });
  tulis(g, 'Tepat waktu (ITW): ' + r.itwSppg + ' SPPG · ' + persen(r.itwSppg, r.sppg) + '%', KP + w + 26, y - 14, { ukuran: 25, warna: WARNA.pudar, maks: 560 });
  tulis(g, String(r.menunggakSppg), KW - KP, y - 40, { berat: 700, ukuran: 66, warna: WARNA.m6, rata: 'right' });
  tulis(g, 'SPPG menunggak', KW - KP, y - 4, { ukuran: 21, warna: WARNA.pudar, rata: 'right' });
  tulis(g, '2 bulan atau lebih', KW - KP, y + 22, { ukuran: 21, warna: WARNA.pudar, rata: 'right' });

  y += 76;
  var maks = Math.max.apply(null, kats.map(function (x) { return x.sppg; }).concat([1]));
  kats.forEach(function (kt) {
    g.fillStyle = WARNA.garis; g.fillRect(KP, y, KW - KP * 2, 2);
    tulis(g, kt.label, KP, y + 40, { berat: 700, ukuran: 29, maks: 330 });
    tulis(g, kt.k === 'tepat' ? 'sudah bayar ' + namaBulanSaja(model.bulanIni) : 'iuran terakhir ' + namaBulanSaja(kt.terbayar), KP, y + 70, { ukuran: 21, warna: WARNA.pudar, maks: 330 });
    var bx = KP + 350, bw = KW - KP * 2 - 350 - 230;
    kotakBulat(g, bx, y + 34, bw, 22, 6, '#EEF0F4');
    kotakBulat(g, bx, y + 34, Math.max(8, bw * kt.sppg / maks), 22, 6, kt.warna);
    var tx = KW - KP;
    g.font = fh(400, 21); var lebarNpp = g.measureText(' · ' + kt.npp + ' NPP').width;
    tulis(g, ' · ' + kt.npp + ' NPP', tx, y + 54, { ukuran: 21, warna: WARNA.pudar, rata: 'right' });
    g.font = fh(600, 21); var lebarS = g.measureText(' SPPG').width;
    tulis(g, ' SPPG', tx - lebarNpp, y + 54, { berat: 600, ukuran: 21, rata: 'right' });
    tulis(g, String(kt.sppg), tx - lebarNpp - lebarS, y + 56, { berat: 700, ukuran: 33, rata: 'right' });
    y += 86;
  });
  g.fillStyle = WARNA.garis; g.fillRect(KP, y, KW - KP * 2, 2);
  tulis(g, 'Satu SPPG = Pengurus + Relawan; statusnya mengikuti NPP yang paling lama menunggak.', KP, y + 50, { ukuran: 20, warna: WARNA.pudar, maks: KW - KP * 2 });
  y += 90;
  kakiKartu(g, y, 'Bayar paling lambat tanggal ' + (+DB.pengaturan.batas || 15) + ' setiap bulan', 'Cara bayar: bit.ly/bayar-iuran-bpjstk');
  return k.c;
}

/* ---------------- 2/3. daftar nama SPPG + PIC ---------------- */
/**
 * butir: [{ judul, sub, kanan1, kanan2, warna2, baru }]
 * Satu kolom sampai 14 baris; lebih dari itu dua kolom (28 per gambar); lebih lagi dibagi beberapa gambar.
 */
function gambarDaftar(opsi) {
  var butir = opsi.butir, hasil = [], per = butir.length <= 14 ? 14 : 28;
  var halaman = Math.max(1, Math.ceil(butir.length / per));
  for (var h = 0; h < halaman; h++) {
    var potong = butir.slice(h * per, (h + 1) * per), dua = per === 28 && potong.length > 14;
    var barisN = dua ? Math.ceil(potong.length / 2) : potong.length, tb = dua ? 118 : 92;
    var tinggi = 220 + 110 + Math.max(1, barisN) * tb + (opsi.catatan ? 70 : 30) + 120;
    var k = kanvasBaru(tinggi), g = k.g;
    var y = kepalaKartu(g, labelKantor(), opsi.judul, opsi.sub + (halaman > 1 ? ' · bagian ' + (h + 1) + '/' + halaman : ''));
    y += 76;
    tulis(g, opsi.bagian, KP, y, { berat: 700, ukuran: 31, warna: opsi.warna, maks: KW - KP * 2 - 200 });
    tulis(g, butir.length + ' SPPG', KW - KP, y, { berat: 700, ukuran: 27, warna: opsi.warna, rata: 'right' });
    g.fillStyle = opsi.warna; g.fillRect(KP, y + 16, KW - KP * 2, 4);
    y += 22;
    if (!potong.length) tulis(g, opsi.kosong || 'Belum ada.', KP, y + 60, { ukuran: 25, warna: WARNA.pudar });
    var kolomW = dua ? (KW - KP * 2 - 40) / 2 : KW - KP * 2;
    potong.forEach(function (b, i) {
      var kol = dua ? Math.floor(i / barisN) : 0, bar = dua ? i % barisN : i;
      var x = KP + kol * (kolomW + 40), yy = y + bar * tb;
      if (bar > 0) { g.fillStyle = WARNA.garis; g.fillRect(x, yy, kolomW, 2); }
      var ukJ = dua ? 25 : 29, ukS = dua ? 18 : 20, kananW = dua ? 0 : 330;
      if (dua) {
        // dua kolom: tiap keterangan di barisnya sendiri agar tidak saling menimpa
        var lJ = tulis(g, b.judul, x, yy + 36, { berat: 700, ukuran: ukJ, maks: kolomW - (b.baru ? 90 : 0) });
        if (b.baru) { kotakBulat(g, x + lJ + 10, yy + 14, 70, 28, 6, WARNA.tepat); tulis(g, 'BARU', x + lJ + 45, yy + 35, { berat: 700, ukuran: 16, warna: '#fff', rata: 'center' }); }
        var lK = b.kanan2 ? tulis(g, b.kanan2, x, yy + 66, { berat: 700, ukuran: 19, warna: b.warna2 || WARNA.pudar, maks: kolomW }) : 0;
        if (b.kanan1) tulis(g, (lK ? ' · ' : '') + b.kanan1, x + lK, yy + 66, { berat: 600, ukuran: 19, warna: WARNA.teks, maks: Math.max(40, kolomW - lK) });
        tulis(g, b.sub, x, yy + 96, { ukuran: ukS, warna: WARNA.pudar, maks: kolomW });
      } else {
        var lj = tulis(g, b.judul, x, yy + 42, { berat: 700, ukuran: ukJ, maks: kolomW - kananW - (b.baru ? 100 : 20) });
        if (b.baru) { kotakBulat(g, x + lj + 12, yy + 18, 76, 30, 6, WARNA.tepat); tulis(g, 'BARU', x + lj + 50, yy + 40, { berat: 700, ukuran: 17, warna: '#fff', rata: 'center' }); }
        tulis(g, b.sub, x, yy + 74, { ukuran: ukS, warna: WARNA.pudar, maks: kolomW - kananW - 20 });
        tulis(g, b.kanan1 || '–', x + kolomW, yy + 42, { berat: 600, ukuran: 24, rata: 'right', maks: kananW });
        tulis(g, b.kanan2 || '', x + kolomW, yy + 74, { berat: 700, ukuran: 20, warna: b.warna2 || WARNA.pudar, rata: 'right', maks: kananW });
      }
    });
    y += Math.max(1, barisN) * tb;
    if (opsi.catatan) { tulis(g, opsi.catatan, KP, y + 46, { ukuran: 21, warna: WARNA.pudar, maks: KW - KP * 2 }); y += 70; } else y += 30;
    kakiKartu(g, y, opsi.kaki1, opsi.kaki2);
    hasil.push(k.c);
  }
  return hasil;
}

function subUnit(u) { return [u.yayasan ? 'Yys. ' + u.yayasan : '', u.kecamatan].filter(String).join(' · ') || u.namaResmi || ''; }

function gambarApresiasi(model) {
  var baru = {};
  baruBayarSejak(model).units.forEach(function (u) { baru[u.id] = true; });
  var units = model.units.filter(function (u) { return u.itb; }).sort(function (a, b) { return ((a.tglBayar || '9') < (b.tglBayar || '9') ? -1 : 1) || (a.label < b.label ? -1 : 1); });

    catatan: Object.keys(baru).length ? 'BARU = bayar sejak laporan sebelumnya.' : '',
    kaki1: 'Apresiasi setinggi-tingginya atas kedisiplinannya', kaki2: 'Terima kasih telah melindungi pengurus dan relawan'
  });
}

function bagianMenunggak(u) {
  var nunggak = u.npps.filter(function (o) { return o.n >= 2; });
  if (u.npps.length > 1 && nunggak.length < u.npps.length) return nunggak.map(function (o) { return o.jenis || o.jenisTampil; }).join(' & ');
  return u.npps.length > 1 ? 'Pengurus & Relawan' : (u.npps[0].jenis || u.npps[0].jenisTampil);
}

function gambarPerhatian(model) {
  var ambang = +DB.pengaturan.ambangGambar || 4;
  var units = model.units.filter(function (u) { return u.koef >= ambang; }).sort(urutTidakPatuh);
  return gambarDaftar({

function bacaFormHasil(akar) {
  var b = akar.querySelector('[data-a="pilihHasil"][aria-pressed="true"]');
  return { hasil: b ? b.dataset.v : 'Terkirim', janji: (akar.querySelector('[data-f="janji"]') || {}).value || '', catatan: ((akar.querySelector('[data-f="catatan"]') || {}).value || '').trim() };
}

/** Templat bawaan hanya ditawarkan untuk SPPG yang sesuai; templat buatan sendiri selalu ditawarkan. */
function templatCocok(t, u) {
  if (u.manual) return t.id === 'pendaftaran' || !/\{rincian\}|\{total\}|\{daftar_npp\}/.test(t.isi);
  if (t.id === 'tagihan') return u.tagihan > 0;
  if (t.id === 'pengingat') return !u.itb;
  if (t.id === 'terima_kasih') return u.itb;
  if (t.id === 'pendaftaran') return false;
  if (t.id === 'ibr') return !!u.ibr;
  return true;
}

function kirimWa(unitId, templatId) {
  var u = cariUnit(unitId), t = templatById(templatId);
  if (!u) return;
  if (!u.pic.wa) { toast('Nomor WA PIC belum ada. Isi lewat tombol Ubah di rincian SPPG.'); return; }
  var pesan = isiPesanWa(t, u, M);
  if (!pesan) { toast('SPPG ini tidak punya tagihan, jadi pesan "' + t.nama + '" dilewati.'); return; }
  window.open(urlWa(u.pic.wa, pesan), '_blank', 'noopener');
  UI.tunggu = { unit: u.id, templat: t.nama, pesan: pesan };
  bukaDialog('<h2>Sudah terkirim ke ' + esc(u.pic.nama || u.pic.waTampil) + '?</h2>' +
    '<div style="color:var(--pudar)">WhatsApp dibuka di jendela baru dengan pesan "' + esc(t.nama) + '" untuk SPPG ' + esc(u.label) + '. Setelah mengirim, catat hasilnya di sini.</div>' +

}

function simpanHasil(asal) {
  var akar = asal === 'dialog' ? $('#dialog') : $('#laci');

  var id = asal === 'dialog' ? UI.tunggu && UI.tunggu.unit : UI.laci;

  if (f.hasil === 'Janji bayar' && !f.janji) { toast('Isi tanggal janji bayar dulu.'); var j = akar.querySelector('[data-f="janji"]'); if (j) j.focus(); return; }
  catatLog({ unit: u.id, npp: (u.npps || []).map(function (o) { return o.npp; }), pic: u.pic.nama, wa: u.pic.wa, templat: asal === 'dialog' ? UI.tunggu.templat : '',
    hasil: f.hasil, janji: f.hasil === 'Janji bayar' ? f.janji : '', catatan: f.catatan, koefSaat: u.manual ? null : u.koef });

    tutupDialog();

}

function unitTersaring() {
  var s = UI.saring, logJeda = {};
  return M.units.filter(function (u) {
    if (!cocokCari(u, s.q)) return false;
    if (s.kat.length) {
      var ok = s.kat.some(function (k) { return k === 'm5+' ? u.koef >= 5 && !u.itb : k === u.kategori; });
      if (!ok) return false;
    }
    if (s.kec && norm(u.kecamatan || '—') !== norm(s.kec)) return false;
    if (s.yys && u.kunciYys !== s.yys) return false;
    if (s.pembina && u.pembina.indexOf(s.pembina) < 0) return false;
    if (s.tindak) {
      var l = u.kontakTerakhir, bulanIni = l && l.tanggal.slice(0, 7) === M.bulanIni;
      if (s.tindak === 'belum' && bulanIni) return false;
      if (s.tindak === 'janji' && !u.janji) return false;
      if (s.tindak === 'jatuh' && !(u.janji && u.janji <= hariIni())) return false;
      if (s.tindak === 'respons' && !(l && l.hasil === 'Tidak ada respons')) return false;
      if (s.tindak === 'nomor' && !(l && l.hasil === 'Nomor salah') && u.pic.wa) return false;
      if (s.tindak === 'bayarwa' && !u.bayarSetelahWa) return false;
    }
    return true;
  }).sort(s.urut === 'patuh' ? urutPatuh : s.urut === 'nama' ? function (a, b) { return a.label < b.label ? -1 : 1; } : urutTidakPatuh);
}

var SASARAN = {
  menunggak: { label: 'Menunggak 2 bulan+', templat: 'tagihan', saring: function (u) { return u.koef >= 2; } },
  lalu: { label: 'Belum bayar bulan ini', templat: 'pengingat', saring: function (u) { return !u.itb && u.koef <= 1; } },
  semua: { label: 'Semua yang belum tepat bulan', templat: 'tagihan', saring: function (u) { return !u.itb; } },
  janji: { label: 'Janji bayar jatuh tempo', templat: 'tagihan', saring: function (u) { return u.janji && u.janji <= hariIni(); } },
  tepat: { label: 'Tepat bulan (terima kasih)', templat: 'terima_kasih', saring: function (u) { return u.itb; } },
  daftar: { label: 'Pendaftaran', templat: 'pendaftaran', saring: null },
  pilihan: { label: 'Pilihan dari dasbor', templat: 'tagihan', saring: function (u) { return (UI.hubungi.ids || []).indexOf(u.id) >= 0; } }
};

function daftarHubungi() {
  var hb = UI.hubungi, s = SASARAN[hb.sasaran], jeda = +DB.pengaturan.jedaKontak || 3, batas = tambahHari(hariIni(), -jeda);
  var arr = hb.sasaran === 'pilihan' ? M.units.concat(M.manual).filter(s.saring) : s.saring ? M.units.filter(s.saring) : M.manual.filter(function (u) { return u.status !== 'Terdaftar aktif'; });
  if (hb.kec) arr = arr.filter(function (u) { return norm(u.kecamatan || '—') === norm(hb.kec); });
  var tersembunyi = 0;
  if (hb.sembunyi) arr = arr.filter(function (u) {
    var l = u.kontakTerakhir, baru = l && l.tanggal > batas && l.tanggal !== hariIni();
    if (baru) tersembunyi++;
    return !baru;
  });
  if (hb.sasaran === 'pilihan') { var urut = UI.hubungi.ids || []; arr.sort(function (a, b) { return urut.indexOf(a.id) - urut.indexOf(b.id); }); }
  else arr.sort(s.saring ? urutTidakPatuh : function (a, b) { return a.label < b.label ? -1 : 1; });
  return { arr: arr, tersembunyi: tersembunyi };
}

function berikutnyaHubungi(idSekarang) {
  var d = daftarHubungi().arr, hi = hariIni();

  for (var k = i + 1; k < d.length; k++) if (!(d[k].kontakTerakhir && d[k].kontakTerakhir.tanggal === hi)) return d[k].id;
  return '';
}

 *  Aksi tombol, isian, impor berkas, tarik-lepas.

async function imporBerkasLaporan(files) {
  if (!files || !files.length) return;
  toast('Membaca ' + files.length + ' file…', 1500);
  var dikenal = {};
  Object.keys(DB.nppUnit).forEach(function (n) { dikenal[n] = true; });
  M.units.forEach(function (u) { u.npps.forEach(function (o) { dikenal[o.npp] = true; }); });
  var hasil = [];
  // urutan: ITW/ITB dulu agar SPPG dikenali, lalu yang lain
  var daftar = Array.prototype.slice.call(files).sort(function (a, b) { var p = function (f) { return /itw|itb/i.test(f.name) ? 0 : 1; }; return p(a) - p(b); });
  for (var i = 0; i < daftar.length; i++) {
    var f = daftar[i];
    try {
      var grid = await bacaBerkas(f), keLensa = '';
      if (lensaAktif()) {
        try { var bl = siapkanBerkasLensa(f.name, grid); if (bl && kirimKeLensa('berkas', { nama: f.name, laporan: bl.jenis, waktu: waktuSekarang(), grid: bl.grid })) keLensa = ' · ' + bl.baris + ' baris binaan ' + kodeLensa() + ' diteruskan ke LENSA PK'; }
        catch (eL) { keLensa = ''; }
      }
      var h;
      try { h = uraiLaporan(f.name, grid, dikenal); } catch (eU) { if (keLensa) eU.message += keLensa; throw eU; }
      if (!h.rows.length) throw new Error('Tidak ada baris SPPG di file ini (' + h.total + ' baris dibaca)' + (keLensa ? keLensa : '') + '.');
      h.rows.forEach(function (r) { dikenal[r.npp] = true; });
      terapkanImpor(f.name, h);
      hasil.push({ ok: true, file: f.name, pesan: NAMA_LAPORAN[h.jenis] + ' per ' + tglSedang(h.periode) + (h.pembina ? ' · pembina ' + h.pembina : '') + ' · ' + h.cek + keLensa });
    } catch (e) {
      catatImporGagal(f.name, e.message);
      hasil.push({ ok: false, file: f.name, pesan: e.message });
    }
  }
  await simpanDb(true);
  UI.hasilImpor = hasil;
  UI.laporan.teks = null;
  M = hitung();
  var ok = hasil.filter(function (x) { return x.ok; }).length;
  toast(ok + ' dari ' + hasil.length + ' file berhasil diimpor.');
  if (UI.tab !== 'data' && hasil.some(function (x) { return !x.ok; })) UI.tab = 'data';
  render(false);
}

function pratinjauDaftar(baris, sumber) {
  var cocok = 0, baru = 0;
  var perLabel = {};
  M.units.forEach(function (u) { (perLabel[norm(u.label)] = perLabel[norm(u.label)] || []).push(u); });
  baris.forEach(function (b) {
    var lb = labelBebas(b.nama), kand = perLabel[norm(lb.label)] || [];
    b._cocok = (b.npp.length && M.units.filter(function (u) { return u.npps.some(function (o) { return b.npp.indexOf(o.npp) >= 0; }); })[0]) ||
      kand.filter(function (u) { return !b.kecamatan || norm(u.kecamatan) === norm(b.kecamatan); })[0] || null;
    if (b._cocok) cocok++; else baru++;
  });
  UI.daftarTunda = baris;
  var hitungStatus = function (s) { return baris.filter(function (b) { return !b._cocok && (b.status || 'Belum terdaftar') === s; }).length; };
  bukaDialog('<h2>Rekap pendaftaran: ' + baris.length + ' SPPG</h2>' +

function terapkanDaftar() {
  var baris = UI.daftarTunda || [];
  var manualAda = {};
  Object.keys(DB.unit).forEach(function (id) { if (DB.unit[id].manual) manualAda[norm(DB.unit[id].nama) + '|' + norm(DB.unit[id].kecamatan)] = id; });
  baris.forEach(function (b) {
    if (b._cocok) {
      var ubah = {};
      if (b.picNama) ubah.picNama = judulNama(b.picNama);
      if (hpSeluler(b.picWa)) ubah.picWa = b.picWa;
      if (Object.keys(ubah).length) ubahUnit(b._cocok.id, ubah);
      return;
    }
    var lb = labelBebas(b.nama), kunci = norm(lb.label) + '|' + norm(b.kecamatan || lb.kecamatan);
    var o = { nama: b.nama, yayasan: b.yayasan, kecamatan: b.kecamatan, desa: b.desa, status: b.status || 'Belum terdaftar', picNama: judulNama(b.picNama), picWa: b.picWa, npp: b.npp };
    if (manualAda[kunci]) {
      var id = manualAda[kunci];
      ubahUnit(id, { status: o.status, picNama: o.picNama, picWa: o.picWa, yayasan: o.yayasan || DB.unit[id].yayasan });
    } else tambahUnitManual(o);
  });
  setDaftarPer(hariIni());
  UI.daftarTunda = null;
  tutupDialog();
  toast('Rekap pendaftaran tersimpan.');
  muatUlang(false);
}

function pasangPeristiwa() {
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-a]');
    if (!el || el.disabled) return;
    var a = el.dataset.a;
    if (!AKSI[a]) return;
    e.preventDefault();
    try { var r = AKSI[a](el.dataset.v, el, e); if (r && r.catch) r.catch(function (x) { toast('Galat: ' + x.message, 5000); }); }
    catch (x) { toast('Galat: ' + x.message, 5000); if (window.console) console.error(x); }
  });
  var tundaQ = null;
  document.addEventListener('input', function (e) {
    var el = e.target, k = el.dataset && el.dataset.in;
    if (!k || !ISIAN_KETIK[k]) return;
    if (k === 'q') { clearTimeout(tundaQ); tundaQ = setTimeout(function () { ISIAN.q(el.value); }, 220); return; }
    ISIAN[k](el.value, el);
  });
  document.addEventListener('change', function (e) {
    var el = e.target, k = el.dataset && el.dataset.in;
    if (k && ISIAN[k] && !ISIAN_KETIK[k]) ISIAN[k](el.value, el);
    if (k && ISIAN_KETIK[k] && k !== 'q' && UI.tab === 'laporan') render(true);
  });
  // teks laporan yang diubah tangan disimpan sementara agar tidak hilang saat layar digambar ulang
  document.addEventListener('input', function (e) { if (e.target.id === 'teksGrup') UI.laporan.teks = e.target.value; });

  $('#pilihBerkas').addEventListener('change', function (e) { imporBerkasLaporan(e.target.files); e.target.value = ''; });
  $('#pilihDaftar').addEventListener('change', async function (e) {
    var f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    try { pratinjauDaftar(uraiPendaftaran(await bacaBerkas(f)), f.name); } catch (x) { toast(x.message, 6000); }
  });
  $('#pilihCadangan').addEventListener('change', async function (e) {
    var f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    if (!confirm('Pulihkan dari cadangan "' + f.name + '"? Data yang ada sekarang di browser ini akan diganti.')) return;
    try { await pulihkanCadangan(f); M = hitung(); toast('Data dipulihkan.'); render(false); } catch (x) { toast(x.message, 6000); }
  });

  $('#laciLatar').addEventListener('click', tutupLaci);
  $('#dialogLatar').addEventListener('click', function (e) { if (e.target.id === 'dialogLatar') tutupDialog(); });
  document.addEventListener('keydown', function (e) {
    if (RAPAT.aktif) {
      if (e.key === 'Escape') tutupRapat();
      else if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); geserRapat(1); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); geserRapat(-1); }
      return;
    }
    if (e.key !== 'Escape') return;
    if (!$('#dialogLatar').hidden) tutupDialog(); else if (UI.laci || UI.laciDaftar) tutupLaci();
  });
  document.addEventListener('fullscreenchange', function () { if (!document.fullscreenElement && RAPAT.aktif) tutupRapat(); });

  // tarik & lepas file di mana saja
  var hitungTarik = 0;
  document.addEventListener('dragenter', function (e) { if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0) { hitungTarik++; $$('[data-lepas]').forEach(function (x) { x.classList.add('aktif'); }); } });
  document.addEventListener('dragleave', function () { if (--hitungTarik <= 0) { hitungTarik = 0; $$('[data-lepas]').forEach(function (x) { x.classList.remove('aktif'); }); } });
  document.addEventListener('dragover', function (e) { e.preventDefault(); });
  document.addEventListener('drop', function (e) {
    e.preventDefault(); hitungTarik = 0; $$('[data-lepas]').forEach(function (x) { x.classList.remove('aktif'); });
    var files = e.dataTransfer && e.dataTransfer.files;
    if (!files || !files.length) return;
    if (UI.tab === 'daftar') {
      bacaBerkas(files[0]).then(function (g) { pratinjauDaftar(uraiPendaftaran(g), files[0].name); }).catch(function (x) { toast(x.message, 6000); });
    } else imporBerkasLaporan(files);
  });

  window.addEventListener('beforeunload', function () { if (SIMPAN.tertunda) tulisDb(); });
  document.addEventListener('visibilitychange', function () { if (document.hidden && SIMPAN.tertunda) tulisDb(); });
}

/* ---------------- grafik SVG ---------------- */

function svgKurva(kd) {
  var W = 640, H = 262, x0 = 46, x1 = 624, y0 = 214, yA = 22, N = 31;
  var pIni = kd.ini.kum.map(function (v) { return 100 * v / (kd.ini.total || 1); });
  var pLalu = kd.lalu.kum.map(function (v) { return 100 * v / (kd.lalu.total || 1); });
  var pProy = kd.proyeksi !== null ? 100 * kd.proyeksi / (kd.ini.total || 1) : 0;
  var maks = Math.max(20, Math.max.apply(null, pIni.concat(pLalu, [pProy, kd.target || 0])));
  var yMax = Math.min(100, Math.ceil(maks / 20) * 20);
  var X = function (d) { return (x0 + (d - 1) * (x1 - x0) / (N - 1)).toFixed(1); };
  var Y = function (p) { return (y0 - p * (y0 - yA) / yMax).toFixed(1); };
  var g = '';
  for (var v = 0; v <= yMax; v += 20) g += '<line x1="' + x0 + '" y1="' + Y(v) + '" x2="' + x1 + '" y2="' + Y(v) + '" stroke="#E3E6EC"/><text x="' + (x0 - 6) + '" y="' + (+Y(v) + 4) + '" text-anchor="end">' + v + '%</text>';
  [1, 5, 10, 15, 20, 25, 31].forEach(function (d) { g += '<text x="' + X(d) + '" y="' + (y0 + 20) + '" text-anchor="middle">' + d + '</text>'; });
  var batas = +DB.pengaturan.batas || 15;
  g += '<line x1="' + X(batas) + '" y1="' + yA + '" x2="' + X(batas) + '" y2="' + y0 + '" stroke="#7E1A1A" stroke-width="1.5" stroke-dasharray="4 4"/><text x="' + (+X(batas) + 6) + '" y="' + (yA + 12) + '" fill="#7E1A1A" font-weight="700">batas tgl ' + batas + '</text>';
  if (kd.target) g += '<line x1="' + x0 + '" y1="' + Y(kd.target) + '" x2="' + x1 + '" y2="' + Y(kd.target) + '" stroke="#1F3E8C" stroke-width="1.5" stroke-dasharray="7 5"/><text x="' + x1 + '" y="' + (+Y(kd.target) - 6) + '" text-anchor="end" fill="#1F3E8C" font-weight="700">target ' + kd.target + '%</text>';
  var garis = function (arr, warna, tebal) {
    if (!arr.length) return '';
    return '<polyline fill="none" stroke="' + warna + '" stroke-width="' + tebal + '" stroke-linejoin="round" stroke-linecap="round" points="' + arr.map(function (p, i) { return X(i + 1) + ',' + Y(p); }).join(' ') + '"/>';
  };
  g += garis(pLalu, '#9AA3B2', 2.5);
  if (pLalu.length) g += '<text class="lbl" x="' + X(pLalu.length) + '" y="' + (+Y(pLalu[pLalu.length - 1]) + 18) + '" text-anchor="end" fill="#566070" font-weight="600">' + esc(namaBulanSaja(kd.lalu.bulan)) + ' ' + Math.round(pLalu[pLalu.length - 1]) + '%</text>';
  if (pIni.length) {
    var dA = pIni.length, pA = pIni[dA - 1];
    if (kd.proyeksi !== null && dA < N) g += '<line x1="' + X(dA) + '" y1="' + Y(pA) + '" x2="' + X(kd.ini.hari) + '" y2="' + Y(pProy) + '" stroke="#1F7A56" stroke-width="2" stroke-dasharray="3 5"/><circle cx="' + X(kd.ini.hari) + '" cy="' + Y(pProy) + '" r="4" fill="#fff" stroke="#1F7A56" stroke-width="2"/>';
    g += garis(pIni, '#1F7A56', 3.5) + '<circle cx="' + X(dA) + '" cy="' + Y(pA) + '" r="5" fill="#1F7A56"/>' +
      '<text class="lbl" x="' + (+X(dA) + 9) + '" y="' + (+Y(pA) - 9) + '" fill="#1F7A56" font-weight="700">' + esc(namaBulanSaja(kd.ini.bulan)) + ' ' + Math.round(pA) + '% · tgl ' + dA + '</text>';
  }
  return '<svg class="grafik" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc('SPPG yang sudah bayar per tanggal. ' + namaBulanSaja(kd.ini.bulan) + ': ' + (pIni.length ? Math.round(pIni[pIni.length - 1]) : 0) + '% pada tanggal ' + pIni.length + '. ' + namaBulanSaja(kd.lalu.bulan) + ': ' + (pLalu.length ? Math.round(pLalu[pLalu.length - 1]) : 0) + '% di akhir bulan.') + '">' + g + '</svg>';
}

function svgTren(t6) {

function kartuTunggakan() {
  var arr = perLamaTunggakan(M), mTk = Math.max.apply(null, arr.map(function (x) { return x.tk; }).concat([1])), mRp = Math.max.apply(null, arr.map(function (x) { return x.terutang; }).concat([1]));
  var h = '<div class="kartu">' + kepalaDasbor('Pekerja & iuran terutang per lama tunggakan', M.rekap.menunggakSppg + ' SPPG menunggak 2 bulan+');
  if (!arr.length) return h + '<div class="kosong">Tidak ada SPPG yang menunggak 2 bulan atau lebih.</div></div>';
  h += '<div class="tunggak-kepala"><span>Lama</span><span>Pekerja</span><span></span><span>Iuran terutang</span><span></span></div>';
  arr.forEach(function (x) {
    var w = warnaKat('m' + x.n);
    h += '<button class="tunggak-baris"' + klik('Menunggak ' + x.n + ' bulan · ' + x.units.length + ' SPPG', ribuan(x.tk) + ' pekerja · ' + rupiah(x.terutang), x.units.slice().sort(urutTidakPatuh)) + '>' +
      '<span class="lbl"><b>' + x.n + ' bln</b> · ' + x.units.length + ' SPPG</span><span class="trek"><div style="width:' + Math.max(3, 100 * x.tk / mTk) + '%;background:' + w + '"></div></span><span class="n">' + ribuan(x.tk) + '</span>' +
      '<span class="trek"><div style="width:' + Math.max(3, 100 * x.terutang / mRp) + '%;background:' + w + '"></div></span><span class="n">' + rupiahRingkas(x.terutang) + '</span></button>';
  });
  var top = arr.slice().sort(function (a, b) { return b.terutang - a.terutang; })[0];
  return h + '<p class="catatan-grafik">Total <b>' + ribuan(M.rekap.tkMenunggak) + ' pekerja</b> · <b>' + rupiahRingkas(M.rekap.tunggakan) + '</b>. Terbesar di kelompok menunggak ' + top.n + ' bulan (' + rupiahRingkas(top.terutang) + ').</p></div>';
}

function kartuRisiko() {
  var rk = M._risiko, bln = namaBulanSaja(rk.bulan);
  var angka = function (label, kini, nanti, fmt) {
    return '<div class="risiko-angka"><span>' + label + '</span><b>' + fmt(kini) + ' → <em>' + fmt(nanti) + '</em></b></div>';
  };
  return '<div class="kartu kartu-risiko">' + kepalaDasbor('Risiko 1 ' + bln, 'bila tidak ada pembayaran lagi') +
    '<div class="grid3">' + angka('SPPG menunggak 2 bln+', rk.sppgKini, rk.sppgNanti, String) + angka('Pekerja terdampak', rk.tkKini, rk.tkNanti, ribuan) + angka('Iuran terutang', rk.terutangKini, rk.terutangNanti, rupiahRingkas) + '</div>' +
    (rk.baru.length ? '<div class="info merah" style="margin-top:12px">' + ikon('info') + '<div><b>' + rk.baru.length + ' SPPG</b> (' + ribuan(rk.baru.reduce(function (s, u) { return s + u.tk; }, 0)) + ' pekerja) yang sekarang masih di bulan lalu akan menjadi menunggak 2 bulan. Prioritaskan pengingat sebelum tanggal ' + (+DB.pengaturan.batas || 15) + '.</div></div>' : '') +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn wa" data-a="hubungiIds" data-v="' + esc(klikIds(rk.baru)) + '">' + ikon('hubungi') + 'Kirim pengingat ke ' + rk.baru.length + ' SPPG</button>' +
    '<button class="btn"' + klik('Akan menjadi menunggak 2 bulan pada 1 ' + bln, 'masih bulan lalu sekarang', rk.baru.slice().sort(function (a, b) { return b.tk - a.tk; })) + '>Lihat daftarnya</button></div></div>';
}

function klikIds(arr) { var k = klik('', '', arr); return k.match(/data-v="([^"]+)"/)[1]; }

function kartuPindah() {
  var opsi = M._pilihanPembanding, dari = UI.pembanding && opsi.some(function (o) { return o.t === UI.pembanding; }) ? UI.pembanding : (opsi[0] || {}).t;
  var h = '<div class="kartu">' + kepalaDasbor('Perpindahan status', '') +
    (opsi.length ? '<label class="field" style="margin-bottom:10px">Dibandingkan dengan data<select class="inp" data-in="pembanding">' + opsi.map(function (o) { return '<option value="' + o.t + '"' + (o.t === dari ? ' selected' : '') + '>' + esc(o.label) + '</option>'; }).join('') + '</select></label>' : '');
  var pd = dari ? perpindahan(M, dari) : null;
  if (!pd || !pd.ada) return h + '<div class="kosong">Butuh laporan dari dua tanggal berbeda. Impor laporan lagi di tanggal lain (mis. besok) untuk melihat SPPG yang membaik atau memburuk.</div></div>';
  var tile = function (label, ids, kls) { return '<button class="ubin-kecil ' + kls + '"' + klik('SPPG ' + label + ' sejak ' + tglSedang(dari), '', ids.map(cariUnit).filter(Boolean).sort(urutTidakPatuh)) + '><b>' + ids.length + '</b><span>' + label + '</span></button>'; };
  h += '<div class="grid3">' + tile('membaik', pd.membaik, 'baik') + tile('tetap', pd.tetap, '') + tile('memburuk', pd.memburuk, 'buruk') + '</div>';
  h += '<div class="matriks" role="table" aria-label="Matriks perpindahan status"><span role="columnheader" class="pojok">dari ↓ ke →</span>' + LABEL_GRUP.map(function (l) { return '<span role="columnheader">' + esc(l.replace('Menunggak ', '')) + '</span>'; }).join('');
  for (var a = 0; a < 4; a++) {
    h += '<span role="rowheader" class="kiri">' + esc(LABEL_GRUP[a]) + '</span>';
    for (var b = 0; b < 4; b++) {
      var ids = pd.mat[a][b], kls = a === b ? 'sama' : b < a ? 'baik' : 'buruk';
      h += ids.length ? '<button class="sel ' + kls + '"' + klik(LABEL_GRUP[a] + ' → ' + LABEL_GRUP[b], 'sejak ' + tglSedang(dari), ids.map(cariUnit).filter(Boolean).sort(urutTidakPatuh)) + '>' + ids.length + '</button>' : '<span class="sel nol">0</span>';
    }
  }
  return h + '</div><p class="catatan-kecil">Hijau = membaik, merah = memburuk. Membaik/memburuk dihitung dari jumlah bulan menunggak (pergantian bulan sudah diperhitungkan).</p></div>';
}

function kartuHariBayar() {
  var sb = M._hari, maks = Math.max.apply(null, sb.ember.map(function (e) { return e.ids.length; }).concat([1]));
  var h = '<div class="kartu">' + kepalaDasbor('Kapan SPPG membayar', 'tanggal lunas iuran ' + esc(namaBulan(sb.bulan)) + ' · ' + sb.n + ' SPPG');
  if (!sb.n) return h + '<div class="kosong">Belum ada tanggal bayar. Impor laporan Monitoring.</div></div>';
  var batas = +DB.pengaturan.batas || 15;
  h += '<div class="histo" role="img" aria-label="' + esc(sb.ember.map(function (e) { return 'tgl ' + e.dari + '–' + e.sampai + ': ' + e.ids.length; }).join(', ')) + '">' + sb.ember.map(function (e) {
    var w = e.sampai <= batas ? WARNA.tepat : e.dari > 25 ? WARNA.m4 : WARNA.m3;
    return '<button class="kolom"' + klik('Bayar tanggal ' + e.dari + '–' + e.sampai + ' ' + namaBulan(sb.bulan), e.ids.length + ' SPPG', e.ids.map(cariUnit).filter(Boolean)) + '><b>' + e.ids.length + '</b><span class="b" style="height:' + Math.max(4, 130 * e.ids.length / maks) + 'px;background:' + w + '"></span><small>' + e.dari + '–' + e.sampai + '</small></button>';
  }).join('') + '</div>';
  var awal = sb.ember.filter(function (e) { return e.sampai <= batas; }).reduce(function (s, e) { return s + e.ids.length; }, 0), akhir = sb.ember[sb.ember.length - 1].ids.length;
  return h + '<p class="catatan-grafik">' + awal + ' dari ' + sb.n + ' SPPG (' + persen(awal, sb.n) + '%) membayar sampai tanggal ' + batas + '; ' + akhir + ' SPPG baru membayar di tanggal 26–31. Pengingat paling berguna dikirim tanggal 5–10.</p></div>';
}

function kartuEfektivitas() {
  var ef = M._ef, h = '<div class="kartu">' + kepalaDasbor('Efektivitas pesan WA', 'bayar ≤ 7 hari setelah pesan · janji bayar');
  if (!ef.length) return h + '<div class="kosong">Belum ada catatan kirim WA. Angka muncul setelah Anda mencatat hasil di Hubungi PIC.</div></div>';
  return h + '<div class="tabel-bungkus" style="box-shadow:none;border:1px solid var(--garis)"><table class="tabel"><thead><tr><th>Templat</th><th class="kanan">Dikirim</th><th class="kanan">Bayar ≤7 hr</th><th style="width:22%"></th><th class="kanan">Janji</th><th class="kanan">Ditepati</th><th class="kanan">Lewat</th></tr></thead><tbody>' +
    ef.map(function (x) {
      var p = persen(x.bayar7, x.kirim);
      return '<tr><td class="nama">' + esc(x.templat) + '</td><td class="kanan angka">' + x.kirim + '</td>' +
        '<td class="kanan angka">' + (x.bayar7 ? '<button class="btn kecil polos"' + klik('Bayar setelah pesan "' + x.templat + '"', '', x.idsBayar.map(cariUnit).filter(Boolean)) + '>' + x.bayar7 + '</button>' : '0') + '</td>' +
        '<td><div class="trek-kecil"><div style="width:' + p + '%"></div></div><small>' + p + '%</small></td><td class="kanan angka">' + x.janji + '</td><td class="kanan angka">' + x.ditepati + '</td>' +
        '<td class="kanan angka">' + (x.lewat ? '<button class="btn kecil polos" style="color:var(--m6)"' + klik('Janji bayar lewat tanpa pembayaran', x.templat, x.idsLewat.map(cariUnit).filter(Boolean)) + '>' + x.lewat + '</button>' : '0') + '</td></tr>';
    }).join('') + '</tbody></table></div><p class="catatan-kecil">Bayar dihitung dari tanggal bayar di laporan Monitoring yang diimpor setelah pesan dikirim.</p></div>';
}

function kartuPapan(jenis) {
  var arr = jenis === 'patuh' ? M.units.slice().sort(urutPatuh).slice(0, 8) : M.units.filter(function (u) { return !u.itb; }).sort(urutTidakPatuh).slice(0, 8);
  var h = '<div class="kartu">' + kepalaDasbor(jenis === 'patuh' ? 'Paling patuh' : 'Paling tidak patuh', '') ;
  if (!arr.length) return h + '<div class="kosong">Belum ada.</div></div>';
  return h + '<div class="papan">' + arr.map(function (u, i) {
    var kanan = jenis === 'patuh' ? (u.itb ? '<span class="lencana-st st-tepat">' + (u.tglBayar ? 'bayar ' + esc(tglPendek(u.tglBayar)) : 'tepat bulan') + '</span>' : lencanaKat(u.kategori, M.M0))
      : '<div style="text-align:right">' + lencanaKat(u.kategori, M.M0) + '<div style="font-size:12px;color:var(--pudar);margin-top:3px">' + (u.tunggakan ? '± ' + rupiahRingkas(u.tunggakan) : u.ibr ? 'IBR belum dirinci' : '') + '</div></div>';
    return '<button class="baris" data-a="laci" data-v="' + esc(u.id) + '"><span class="peringkat" style="background:' + (jenis === 'patuh' ? WARNA.tepat : warnaKat(u.kategori)) + '">' + (i + 1) + '</span>' +
      '<span class="tengah"><b>SPPG ' + esc(u.label) + '</b><small>' + esc([u.yayasan, u.pic.nama].filter(String).join(' · ')) + '</small></span>' + kanan + '</button>';
  }).join('') + '</div><button class="btn kecil polos" style="margin-top:8px"' + klik(jenis === 'patuh' ? 'SPPG paling patuh' : 'SPPG paling tidak patuh', '', jenis === 'patuh' ? M.units.slice().sort(urutPatuh) : M.units.filter(function (u) { return !u.itb; }).sort(urutTidakPatuh)) + '>Lihat semua</button></div>';
}

function kartuPembina() {
  var arr = M._pembina;
  return '<div class="kartu">' + kepalaDasbor('Per pembina', arr.length > 1 ? 'urut ITW tertinggi' : 'impor laporan pembina lain untuk membandingkan') +
    '<div class="tabel-bungkus" style="box-shadow:none;border:1px solid var(--garis)"><table class="tabel"><thead><tr><th>Pembina</th><th class="kanan">SPPG</th><th class="kanan">ITB</th><th class="kanan">ITW</th><th class="kanan">Menunggak</th><th class="kanan">Terutang</th><th>Data per</th></tr></thead><tbody>' +
    arr.map(function (x) {
      var lama = M.dataPer.akhir && selisihHari(x.dataPer, M.dataPer.akhir) > 3;
      return '<tr class="klik"' + klik('Pembina ' + x.pembina, x.units.length + ' SPPG', x.units.slice().sort(urutTidakPatuh)) + '><td class="nama">' + esc(x.pembina) + '</td><td class="kanan angka">' + x.units.length + '</td><td class="kanan angka">' + x.pItb + '%</td><td class="kanan angka">' + x.pItw + '%</td>' +
        '<td class="kanan angka"' + (x.menunggak ? ' style="color:var(--m6);font-weight:700"' : '') + '>' + x.menunggak + '</td><td class="kanan angka">' + (x.tunggakan ? rupiahRingkas(x.tunggakan) : '–') + '</td><td' + (lama ? ' style="color:var(--m5);font-weight:700"' : '') + '>' + esc(tglPendek(x.dataPer)) + '</td></tr>';
    }).join('') + '</tbody></table></div></div>';
}

function kartuKecamatan() {
  var arr = rekapPer(M.units, function (u) { return u.kecamatan; }).sort(function (a, b) { return (b.menunggak - a.menunggak) || (b.units.length - a.units.length); });
  return '<div class="kartu">' + kepalaDasbor('Per kecamatan', kotakWarna(WARNA.tepat) + ' tepat ' + kotakWarna(WARNA.lalu) + ' bulan lalu ' + kotakWarna(WARNA.m5) + ' menunggak') +
    '<div class="tabel-bungkus" style="box-shadow:none;border:1px solid var(--garis)"><table class="tabel"><thead><tr><th>Kecamatan</th><th class="kanan">SPPG</th><th style="width:30%">Sebaran</th><th class="kanan">Tepat</th><th class="kanan">Menunggak</th></tr></thead><tbody>' +
    arr.map(function (x) {
      var nm = x.label === '—' ? 'Tanpa kecamatan' : x.label;
      return '<tr class="klik"' + klik('Kecamatan ' + nm, x.units.length + ' SPPG', x.units.slice().sort(urutTidakPatuh)) + '><td class="nama">' + esc(nm) + '</td><td class="kanan angka">' + x.units.length + '</td><td><div class="bar-tumpuk" style="height:12px">' +
        '<div style="flex:' + x.tepat + ' 1 0;background:var(--tepat)"></div><div style="flex:' + x.lalu + ' 1 0;background:var(--lalu)"></div><div style="flex:' + x.menunggak + ' 1 0;background:var(--m5)"></div></div></td>' +
        '<td class="kanan angka">' + x.tepat + '</td><td class="kanan angka"' + (x.menunggak ? ' style="color:var(--m6);font-weight:700"' : '') + '>' + x.menunggak + '</td></tr>';
    }).join('') + '</tbody></table></div></div>';
}

function kartuPerhatian() {
  var pp = M._perhatian;
  var tile = function (judul, ids, ket, warna) {
    return '<button class="ubin klikable"' + klik(judul, ket, ids) + '><span class="label-kecil">' + esc(judul) + '</span><span class="besar"' + (ids.length && warna ? ' style="color:' + warna + '"' : '') + '>' + ids.length + '</span><span class="ket">' + ket + '</span></button>';
  };
  return '<div class="grid4">' +
    tile('SPPG baru (≤ 3 bulan)', pp.baru.concat(pp.setor), pp.baru.length + ' terdaftar baru · ' + pp.setor.length + ' menunggu iuran pertama', WARNA.m3) +
    tile('IBR belum dirinci', pp.ibr, 'sudah bayar, rincian TK belum lengkap', WARNA.lalu) +
    tile('Janji bayar jatuh tempo', pp.janji, 'janji sudah lewat/hari ini, belum lunas', WARNA.m5) +
    tile('PIC tanpa nomor WA', pp.tanpaWa, 'lengkapi lewat Ubah di rincian SPPG', WARNA.m4) + '</div>';
}

/* ---------------- layar dasbor ---------------- */

function siapkanAnalisa() {
  M._kd = kurvaDuaBulan(M);
  M._t6 = tren6Bulan(M);
  M._risiko = risikoBulanDepan(M);
  M._hari = sebaranHariBayar(M);
  M._ef = efektivitasWa(M);
  M._pembina = rekapPembina(M);
  M._perhatian = perluPerhatian(M);
  M._pilihanPembanding = pilihanPembanding(M);
}

LAYAR.dasbor = function () {
  if (!M || !M.ada) return layarKosong();
  UI.klik = {}; UI.klikN = 0;
  siapkanAnalisa();
  var r = M.rekap;
  var h = '<div class="kepala"><div><h1>Kepatuhan iuran SPPG</h1><div class="sub">' + esc(namaBulan(M.bulanIni)) + ' · data per ' + esc(M.dataPer.teks) + ' · ' + r.sppg + ' SPPG · ' + r.npp + ' NPP · ' + ribuan(r.tk) + ' pekerja</div></div>' +
    '<div class="kepala-aksi">' + (sinkAktif() ? '<button class="btn" data-a="sinkronSekarang">' + ikon('sinkron') + 'Sinkron sekarang</button>' : '') + '<button class="btn" data-a="rapat">' + ikon('layar') + 'Mode rapat</button><button class="btn" data-a="pilihBerkas">' + ikon('unggah') + 'Impor laporan</button><button class="btn utama" data-a="tab" data-v="laporan">' + ikon('laporan') + 'Buat laporan grup</button></div></div>';
  h += blokPeringatan();
  h += kartuKpi();
  h += '<div class="grid2">' + kartuKurva() + kartuTren() + '</div>';
  h += '<div class="grid2">' + kartuSebaran() + kartuTunggakan() + '</div>';
  h += '<div class="grid2">' + kartuRisiko() + kartuPindah() + '</div>';
  h += kartuPerhatian();
  h += '<div class="grid2">' + kartuHariBayar() + kartuEfektivitas() + '</div>';
  h += '<div class="grid2">' + kartuPapan('tidak') + kartuPapan('patuh') + '</div>';
  h += '<div class="grid2">' + kartuPembina() + kartuKecamatan() + '</div>';
  return h;
};

/* ---------------- panel daftar (laci) ---------------- */

function renderLaciDaftar() {
  var d = UI.laciDaftar, l = $('#laci');
  var units = d.ids.map(cariUnit).filter(Boolean);
  var hi = hariIni();
  var h = '<div class="laci-kepala"><div><h2>' + esc(d.judul) + '</h2><div class="sub">' + units.length + ' SPPG' + (d.sub ? ' · ' + esc(d.sub) : '') + '</div></div>' +
    '<button class="tutup" data-a="tutupLaci" aria-label="Tutup">' + ikon('tutup') + '</button></div><div class="laci-isi">';
  h += '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn wa" data-a="hubungiDaftar"' + (units.length ? '' : ' disabled') + '>' + ikon('hubungi') + 'Kirim beruntun di Hubungi PIC</button><button class="btn" data-a="unduhDaftar">' + ikon('unduh') + 'Unduh (Excel)</button></div>';
  if (!units.length) h += '<div class="kartu kosong">Tidak ada SPPG.</div>';
  h += units.map(function (u) {
    var st = u.manual ? '<span class="lencana-st ' + (u.status === 'Sudah setor data' ? 'st-m3' : 'st-m6') + '">' + esc(u.status) + '</span>' : lencanaKat(u.kategori, M.M0);
    var tercatat = u.kontakTerakhir && u.kontakTerakhir.tanggal === hi;
    var adaTagihan = !u.manual && u.tagihan > 0;
    return '<div class="kartu kartu-sppg' + (tercatat ? ' sudah' : '') + '"><div class="atas"><button class="nama-sppg" data-a="laci" data-v="' + esc(u.id) + '">SPPG ' + esc(u.label) + '</button>' + st + '</div>' +
      '<div class="sub">' + esc([u.yayasan, u.kecamatan].filter(String).join(' · ')) + (u.tunggakan ? ' · terutang ' + rupiahRingkas(u.tunggakan) : '') + (u.tk ? ' · ' + u.tk + ' pekerja' : '') + '</div>' +
      '<div class="pic"><div><b>' + esc(u.pic.nama || 'PIC belum diisi') + '</b><span>' + esc(u.pic.waTampil || 'nomor WA belum ada') + '</span></div>' +
      '<div class="tombol">' + (u.pic.wa ? '<button class="btn kecil" data-a="kirimWaId" data-v="' + esc(u.id) + '|sapa">' + ikon('hubungi') + 'Sapa</button>' +
        '<button class="btn kecil wa" data-a="kirimWaId" data-v="' + esc(u.id) + '|' + (adaTagihan ? 'tagihan' : u.manual ? 'pendaftaran' : u.itb ? 'terima_kasih' : 'pengingat') + '">' + (adaTagihan ? 'Tagihan' : u.manual ? 'Pendaftaran' : u.itb ? 'Terima kasih' : 'Pengingat') + '</button>'
        : '<button class="btn kecil" data-a="ubahUnitId" data-v="' + esc(u.id) + '">Isi nomor WA</button>') +
      '<button class="btn kecil polos" data-a="laci" data-v="' + esc(u.id) + '">Rincian</button></div></div>' +
      '<div class="kontak">' + teksKontak(u) + '</div></div>';
  }).join('');
  l.innerHTML = h + '</div>';
  l.hidden = false; $('#laciLatar').hidden = false;
}

/* ---------------- mode rapat ---------------- */

var RAPAT = { aktif: false, i: 0, timer: null, jeda: 15000 };
var SLIDE_RAPAT = [
  ['Ringkasan', function () { return kartuKpi() + '<div class="grid2">' + kartuSebaran() + kartuTunggakan() + '</div>'; }],
  ['Kemajuan pembayaran', function () { return '<div class="grid2">' + kartuKurva() + kartuTren() + '</div>'; }],
  ['Risiko & perpindahan', function () { return '<div class="grid2">' + kartuRisiko() + kartuPindah() + '</div>' + kartuPerhatian(); }],
  ['Pembina & kecamatan', function () { return '<div class="grid2">' + kartuPembina() + kartuKecamatan() + '</div>'; }],
  ['Peringkat SPPG', function () { return '<div class="grid2">' + kartuPapan('tidak') + kartuPapan('patuh') + '</div>'; }]
];

function bukaRapat() {
  if (!M || !M.ada) return;
  var el = document.getElementById('rapat');
  if (!el) { el = document.createElement('div'); el.id = 'rapat'; el.className = 'rapat'; document.body.appendChild(el); }
  RAPAT.aktif = true; RAPAT.i = 0;
  el.hidden = false;
  try { if (el.requestFullscreen) el.requestFullscreen().catch(function () {}); } catch (e) { /* opsional */ }
  renderRapat();
}

function renderRapat() {
  var el = document.getElementById('rapat');
  if (!el || !RAPAT.aktif) return;
  UI.klik = {}; UI.klikN = 0;
  siapkanAnalisa();
  var s = SLIDE_RAPAT[RAPAT.i];
  el.innerHTML = '<div class="rapat-kepala"><div><b>Monitor SPPG · ' + esc(s[0]) + '</b><span>' + esc(namaBulan(M.bulanIni)) + ' · data per ' + esc(M.dataPer.teks) + '</span></div>' +
    '<div class="rapat-titik">' + SLIDE_RAPAT.map(function (x, i) { return '<button data-a="rapatKe" data-v="' + i + '" aria-label="' + esc(x[0]) + '"' + (i === RAPAT.i ? ' aria-current="true"' : '') + '></button>'; }).join('') + '</div>' +
    '<div class="rapat-tombol"><button data-a="rapatGeser" data-v="-1" aria-label="Sebelumnya">‹</button><button data-a="rapatJeda" aria-label="Jeda">' + (RAPAT.berhenti ? '▶' : '❚❚') + '</button><button data-a="rapatGeser" data-v="1" aria-label="Berikutnya">›</button><button data-a="tutupRapat" aria-label="Keluar">✕</button></div></div>' +
    '<div class="rapat-isi">' + s[1]() + '</div>';
  clearTimeout(RAPAT.timer);
  if (!RAPAT.berhenti) RAPAT.timer = setTimeout(function () { geserRapat(1); }, RAPAT.jeda);
}

function geserRapat(n) { RAPAT.i = (RAPAT.i + n + SLIDE_RAPAT.length) % SLIDE_RAPAT.length; renderRapat(); }

function tutupRapat() {
  RAPAT.aktif = false; clearTimeout(RAPAT.timer); RAPAT.timer = null;
  var el = document.getElementById('rapat');
  if (el) { el.hidden = true; el.innerHTML = ''; }
  try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) { /* opsional */ }
}

/* === 99-mulai.js === */
/* ---------------- mulai ---------------- */

async function mulai() {
  pasangPeristiwa();
  try { await muatDb(); } catch (e) { SIMPAN.galat = e.message; }
  M = hitung();
  render(false);
  mulaiSinkronOtomatis();
  daftarkanPwa();
  // untuk pengujian otomatis
  window.MonitorSPPG = { DB: function () { return DB; }, M: function () { return M; }, UI: UI, hitung: hitung, UJI: UJI, muatUlang: muatUlang, tulisDb: tulisDb };
}

/** Setelah sinkron membawa data baru: hitung ulang; jangan ganggu bila sedang mengetik. */
function setelahSinkron() {
  M = hitung();
  var aktif = document.activeElement;
  if (aktif && /^(INPUT|TEXTAREA|SELECT)$/.test(aktif.tagName) && $('#isi').contains(aktif)) { renderNav(); UI.perluRender = true; return; }
  if (!$('#dialogLatar').hidden) { renderNav(); UI.perluRender = true; return; }
  render(true);
  if (RAPAT.aktif) renderRapat();
}

/** Versi GitHub (https): aplikasi bisa dipasang & dibuka tanpa sinyal. Dari file lokal: dilewati. */
function daftarkanPwa() {
  if (location.protocol !== 'https:') return;
  try {
    var l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l);
    var i = document.createElement('link'); i.rel = 'apple-touch-icon'; i.href = 'ikon-192.png'; document.head.appendChild(i);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { /* opsional */ });
  } catch (e) { /* opsional */ }
}

document.addEventListener('focusout', function () { if (UI.perluRender) setTimeout(function () { var a = document.activeElement; if (!a || !/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) { UI.perluRender = false; render(true); } }, 300); });

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mulai);
else mulai();

})();
</script>

<title>Monitor SPPG · BPJS Ketenagakerjaan KC Pamekasan</title>
<style>
:root{
  --biru:#1F3E8C;--biru2:#2B4FA8;--biruTua:#16306F;--biruL:#E8ECF7;--teks:#16202E;--pudar:#566070;--garis:#E3E6EC;--garis2:#C9CED8;--latar:#F3F4F7;--putih:#fff;
  --tepat:#1F7A56;--tepatL:#E3F2E9;--lalu:#3F63B8;--laluL:#E8ECF7;--m2:#E0A81E;--m3:#D97A1E;--m4:#C4551C;--m5:#A33319;--m6:#7E1A1A;--merahL:#F9E1DF;--kuningL:#FBEFD5;
  --wa:#17794A;--r:14px;--bayang:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --huruf:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--latar);color:var(--teks);font:15px/1.45 var(--huruf);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:15px}
a{color:var(--biru)}
h1,h2,h3{margin:0;line-height:1.2}
.angka{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- kerangka ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;background:linear-gradient(90deg,var(--biru) 232px,var(--latar) 232px)}
.sisi{background:var(--biru);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 12px 14px;gap:18px;overflow-y:auto}
.merek{padding:0 6px;display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:11px;align-items:center}
.merek-logo{grid-row:1 / span 2;width:44px;height:44px;border-radius:11px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.merek-judul{font-size:21px;font-weight:700;letter-spacing:-.2px}
.merek-sub{font-size:12px;color:#C9D3EE;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:10px;background:none;color:#DCE3F5;font-weight:500;text-align:left;cursor:pointer}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button[aria-current="page"]{background:#fff;color:var(--biru);font-weight:700}
.nav svg{width:20px;height:20px;flex:none}
.nav .lencana{margin-left:auto;background:#FBEFD5;color:#5C3D00;border-radius:999px;font-size:12px;font-weight:700;padding:1px 8px}
.sisi-bawah{margin-top:auto;font-size:12px;color:#C9D3EE;padding:0 8px;display:flex;flex-direction:column;gap:6px}
.titik{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7FE0B0;margin-right:6px;vertical-align:middle}
.titik.kuning{background:#F5C451}
.isi{min-width:0;padding:26px 32px 48px;outline:none}
.isi-dalam{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

.kepala{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.kepala h1{font-size:26px;font-weight:700;letter-spacing:-.3px}
.kepala .sub{color:var(--pudar);margin-top:4px}
.kepala-aksi{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- komponen ---------- */
.kartu{background:#fff;border-radius:var(--r);box-shadow:var(--bayang);padding:18px 20px}
.kartu h2{font-size:17px;font-weight:700}
.kartu-kepala{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.kartu-kepala .ket{color:var(--pudar);font-size:13px}
.label-kecil{font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--pudar);text-transform:uppercase}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr));gap:18px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:14px}
.ubin{background:#fff;border-radius:var(--r);box-shadow:var(--bayang);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.ubin .besar{font-size:32px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.ubin .besar small{font-size:16px;color:var(--pudar);font-weight:600}
.ubin .ket{font-size:13px;color:var(--pudar)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--garis2);background:#fff;color:var(--teks);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#9AA3B2;background:#FAFBFC}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.utama{background:var(--biru);border-color:var(--biru);color:#fff}
.btn.utama:hover{background:var(--biruTua)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.wa:hover{background:#11633C}
.btn.bahaya{color:#9E2A22;border-color:#E3B4AF}
.btn.kecil{min-height:34px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.polos{border-color:transparent;background:none;color:var(--biru)}
.btn.polos:hover{background:var(--biruL)}
.btn svg{width:18px;height:18px;flex:none}

.chip-baris{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--garis2);background:#fff;font-size:13px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--teks);border-color:var(--teks);color:#fff}
.kotak{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.seg{display:inline-grid;grid-auto-flow:column;gap:4px;background:#E3E6EC;border-radius:12px;padding:4px}
.seg button{min-height:36px;padding:0 14px;border:0;border-radius:9px;background:none;font-weight:600;color:var(--pudar);cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:var(--teks);box-shadow:0 1px 2px rgba(16,24,40,.12)}

.lencana-st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:6px;padding:3px 8px;white-space:nowrap}
.st-tepat{background:var(--tepatL);color:#155C40}
.st-lalu{background:var(--laluL);color:#2B4A93}
.st-m2{background:#FBF0D2;color:#6B4A00}
.st-m3{background:#FBE5CC;color:#7A3F00}
.st-m4{background:#F9DCCB;color:#8A3410}
.st-m5,.st-m6,.st-mx{background:var(--m6);color:#fff}
.st-abu{background:#EEF0F4;color:var(--pudar)}

.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--pudar)}
.inp{min-height:40px;border:1px solid var(--garis2);border-radius:10px;padding:0 12px;background:#fff;width:100%;color:var(--teks);font-weight:400}
textarea.inp{padding:10px 12px;min-height:120px;resize:vertical;line-height:1.45}
.inp:focus,.btn:focus-visible,.chip:focus-visible,.nav button:focus-visible{outline:3px solid #9AAAD3;outline-offset:1px}
select.inp{padding-right:28px}
.baris-saring{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.baris-saring .field{min-width:170px}
.cari{position:relative;flex:1 1 260px}
.cari input{padding-left:38px}
.cari svg{position:absolute;left:12px;top:11px;width:18px;height:18px;color:var(--pudar)}

/* ---------- tabel ---------- */
.tabel-bungkus{overflow:auto;border-radius:var(--r);background:#fff;box-shadow:var(--bayang)}
table.tabel{width:100%;border-collapse:collapse;font-size:14px}
.tabel th{position:sticky;top:0;background:#F7F8FA;text-align:left;font-size:12px;font-weight:700;color:var(--pudar);padding:10px 12px;border-bottom:1px solid var(--garis);white-space:nowrap;z-index:1}
.tabel td{padding:10px 12px;border-bottom:1px solid var(--garis);vertical-align:middle}
.tabel tr.klik{cursor:pointer}
.tabel tr.klik:hover td{background:#FAFBFD}
.tabel .kanan{text-align:right}
.tabel .nama{font-weight:700}
.tabel .sub{font-size:12px;color:var(--pudar)}
.tabel tr:last-child td{border-bottom:0}
.no{color:var(--pudar);font-size:12px;width:36px}

/* bulan bayar per NPP */
.bulan{display:grid;grid-template-columns:repeat(6,13px);gap:4px}
.bulan span{width:13px;height:13px;border-radius:3px;box-sizing:border-box}
.bulan .y{background:var(--biru)}
.bulan .t{border:2px solid var(--m4)}
.bulan-label{display:grid;grid-template-columns:repeat(6,13px);gap:4px;font-size:10px;color:var(--pudar);text-align:center}
.npp-mini{display:flex;flex-direction:column;gap:4px}
.npp-mini .r{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--pudar)}
.npp-mini .r b{width:58px;font-weight:600;color:var(--teks)}

/* ---------- grafik ---------- */
.bar-tumpuk{display:flex;gap:2px;height:22px;border-radius:6px;overflow:hidden}
.bar-tumpuk div{min-width:3px}
.rekap-baris{display:grid;grid-template-columns:minmax(178px,1.4fr) minmax(70px,1.6fr) 56px 50px;gap:14px;align-items:center;min-height:48px;border-top:1px solid var(--garis);padding:0 4px;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;cursor:pointer}
.rekap-baris:hover{background:#FAFBFD}
.rekap-baris .lbl{display:flex;align-items:center;gap:10px}
.rekap-baris .lbl small{display:block;color:var(--pudar);font-size:12px;white-space:nowrap}
.rekap-baris .lbl>span{white-space:nowrap;font-weight:600}
.rekap-baris .trek{height:12px;background:#EEF0F4;border-radius:4px;overflow:hidden}
.rekap-baris .trek div{height:12px;border-radius:4px}
.rekap-baris .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.rekap-baris .n small{display:block;font-size:11px;color:var(--pudar);font-weight:500}
.rekap-kepala{display:grid;grid-template-columns:minmax(178px,1.4fr) minmax(70px,1.6fr) 56px 50px;gap:14px;padding:0 4px 6px;font-size:11px;font-weight:700;color:var(--pudar);text-transform:uppercase;letter-spacing:.6px}
.rekap-kepala span:nth-child(n+3){text-align:right}
.papan{display:flex;flex-direction:column}
.papan .baris{display:flex;align-items:center;gap:12px;min-height:56px;border-top:1px solid var(--garis);cursor:pointer;padding:0 4px;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.papan .baris:hover{background:#FAFBFD}
.papan .baris:first-child{border-top:0}
.peringkat{width:28px;height:28px;border-radius:50%;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.papan .tengah{flex:1;min-width:0}
.papan .tengah b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.papan .tengah small{display:block;color:var(--pudar);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tren{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px}
.tren .k{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.tren .b{width:100%;max-width:56px;background:var(--tepat);border-radius:6px 6px 0 0}
.tren .v{font-weight:700;font-size:13px}
.tren .t{font-size:11px;color:var(--pudar)}

/* ---------- pemberitahuan ---------- */
.info{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--kuningL);color:#5C3D00;font-size:14px}
.info.biru{background:var(--biruL);color:#22356F}
.info.merah{background:var(--merahL);color:#7E1A1A}
.info svg{width:18px;height:18px;flex:none;margin-top:2px}
.kosong{text-align:center;color:var(--pudar);padding:36px 16px}
.lepas{border:2px dashed var(--garis2);border-radius:var(--r);padding:28px;text-align:center;background:#fff;display:flex;flex-direction:column;align-items:center;gap:10px}
.lepas.aktif{border-color:var(--biru);background:var(--biruL)}
.lepas p{margin:0;color:var(--pudar)}
.daftar-hasil{display:flex;flex-direction:column;gap:6px;font-size:14px}
.daftar-hasil .ok{color:#155C40}
.daftar-hasil .gagal{color:#9E2A22}

/* ---------- laci rincian ---------- */
.laci-latar{position:fixed;inset:0;background:rgba(16,24,40,.32);z-index:40}
.laci{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--latar);z-index:41;overflow-y:auto;box-shadow:-8px 0 24px rgba(16,24,40,.18);display:flex;flex-direction:column}
.laci-kepala{position:sticky;top:0;background:var(--biru);color:#fff;padding:16px 16px 16px 20px;display:flex;align-items:flex-start;gap:12px;z-index:2}
.laci-kepala h2{font-size:20px}
.laci-kepala .sub{color:#DCE3F5;font-size:13px;margin-top:3px}
.laci-kepala .tutup{margin-left:auto;background:none;border:0;color:#fff;width:40px;height:40px;border-radius:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.laci-kepala .tutup:hover{background:rgba(255,255,255,.15)}
.laci-isi{padding:16px;display:flex;flex-direction:column;gap:14px}
.npp-kartu{border:1px solid var(--garis);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--pudar)}
.kv dd{margin:0;font-weight:600}
.hasil-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hasil-grid button{min-height:40px;border:1px solid var(--garis2);border-radius:10px;background:#fff;font-weight:500;cursor:pointer;font-size:13px}
.hasil-grid button[aria-pressed="true"]{border:2px solid var(--biru);background:var(--biruL);color:var(--biru);font-weight:700}
.riwayat{display:flex;flex-direction:column}
.riwayat .r{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--garis);font-size:13px}
.riwayat .r:first-child{border-top:0}
.riwayat .r .w{color:var(--pudar);width:92px;flex:none}

/* ---------- hubungi ---------- */
.antre .tabel td{vertical-align:top}
.panel-hasil{background:#F7F8FA;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.panel-hasil .judul{font-weight:700;font-size:13px}
.panel-hasil .tombol{display:flex;flex-wrap:wrap;gap:6px}
.kemajuan{height:8px;background:#E3E6EC;border-radius:4px;overflow:hidden}
.kemajuan div{height:8px;background:var(--wa)}

/* ---------- laporan ---------- */
.laporan-tata{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:18px;align-items:start}
.opsi{display:flex;flex-direction:column;gap:14px}
.opsi label.cek{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.opsi label.cek input{width:18px;height:18px;margin-top:2px;flex:none}
.pratinjau-gambar{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.gambar-kartu{background:#fff;border-radius:12px;box-shadow:var(--bayang);padding:10px;display:flex;flex-direction:column;gap:8px}
.gambar-kartu img{width:100%;border-radius:6px;border:1px solid var(--garis);cursor:zoom-in;background:#fff}
.gambar-kartu .aksi{display:flex;gap:6px;flex-wrap:wrap}
.teks-laporan{font:14px/1.5 var(--huruf);white-space:pre-wrap}
textarea.inp.teks-laporan{min-height:440px}

/* ---------- dialog & toast ---------- */
.dialog-latar{position:fixed;inset:0;background:rgba(16,24,40,.4);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.dialog{background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(16,24,40,.3);width:min(620px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.dialog.lebar{width:min(1100px,100%)}
.dialog h2{font-size:19px}
.dialog .aksi{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dialog img.penuh{width:100%;border:1px solid var(--garis);border-radius:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1B2430;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:min(560px,calc(100vw - 32px))}
.toast.tampil{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- layar sedang & tablet ---------- */
@media (max-width:1100px){
  .app{grid-template-columns:86px minmax(0,1fr);background:linear-gradient(90deg,var(--biru) 86px,var(--latar) 86px)}
  .sisi-bawah{display:none}
  .sisi{padding:16px 8px;align-items:stretch}
  .merek-sub,.sisi-bawah span.panjang{display:none}
  .merek{display:block;padding:0}
  .merek-logo{display:block;width:40px;height:40px;margin:0 auto 6px}
  .merek-judul{font-size:13px;text-align:center}
  .nav button{flex-direction:column;gap:3px;min-height:58px;padding:6px 2px;font-size:11px;text-align:center;justify-content:center}
  .nav .lencana{position:absolute;margin:0;transform:translate(18px,-16px);font-size:10px;padding:0 6px}
  .nav button{position:relative}
  .isi{padding:20px 20px 40px}
  .laporan-tata{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);background:var(--latar)}

/* ---------- dasbor v2 ---------- */
.grid5{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
button.ubin{border:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.ubin.klikable:hover,.ubin-kecil:hover{box-shadow:0 0 0 2px var(--biru2),var(--bayang)}

.grafik-tombol{display:block;width:100%;padding:0;border:0;background:none;cursor:pointer;border-radius:10px}

.tunggak-kepala{font-size:11px;font-weight:700;color:var(--pudar);text-transform:uppercase;letter-spacing:.6px;padding:0 4px 6px}
.tunggak-baris{width:100%;min-height:44px;border:0;border-top:1px solid var(--garis);background:none;padding:0 4px;text-align:left;cursor:pointer;font:inherit;font-size:13px;color:inherit}

.kartu-risiko{border-top:5px solid var(--m6)}
.risiko-angka{display:flex;flex-direction:column;gap:2px}
.risiko-angka span{font-size:12px;color:var(--pudar)}
.risiko-angka b{font-size:21px;font-variant-numeric:tabular-nums}

.ubin-kecil b{font-size:24px;line-height:1.1}
.ubin-kecil span{font-size:12px;font-weight:600}
.ubin-kecil.baik{background:var(--tepatL);color:#155C40}
.ubin-kecil.buruk{background:var(--merahL);color:var(--m6)}
.matriks{display:grid;grid-template-columns:128px repeat(4,minmax(0,1fr));gap:4px;margin-top:12px;font-size:12px;text-align:center}
.matriks [role=columnheader]{color:var(--pudar);font-weight:700;padding:4px 0}
.matriks .pojok,.matriks .kiri{text-align:left;font-weight:600;color:var(--teks);padding:8px 0}
.matriks .pojok{color:var(--pudar)}
.matriks .sel{border:0;border-radius:6px;padding:9px 0;font:inherit;font-weight:700}

.matriks .sama{background:#E3E6EC}
.matriks .baik{background:#BFE3CD;color:#155C40}
.matriks .buruk{background:#F4C9C4;color:var(--m6)}
.matriks .nol{background:#F7F8FA;color:#9AA3B2;font-weight:400}
.histo{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;align-items:end;height:190px;padding-top:6px}

.histo .b{width:100%;max-width:58px;border-radius:6px 6px 0 0;display:block}
.histo small{font-size:12px;color:var(--pudar)}
.trek-kecil{height:8px;background:#EEF0F4;border-radius:4px;overflow:hidden;display:inline-block;width:70%;vertical-align:middle;margin-right:6px}

.sinkron-status{display:flex;align-items:center;background:none;border:0;color:inherit;font:inherit;font-size:12px;padding:0;cursor:pointer;text-align:left}

.kartu-sppg{padding:12px 14px;display:flex;flex-direction:column;gap:6px}

.kartu-sppg .atas{display:flex;align-items:center;justify-content:space-between;gap:10px}
.kartu-sppg .nama-sppg{border:0;background:none;padding:0;font:inherit;font-weight:700;font-size:15px;color:var(--teks);cursor:pointer;text-align:left}
.kartu-sppg .nama-sppg:hover{color:var(--biru)}
.kartu-sppg .sub{font-size:12px;color:var(--pudar)}
.kartu-sppg .pic{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--garis);padding-top:8px}
.kartu-sppg .pic div:first-child{display:flex;flex-direction:column}
.kartu-sppg .pic span{font-size:12px;color:var(--pudar)}
.kartu-sppg .tombol{display:flex;gap:6px;flex-wrap:wrap}
.kartu-sppg .kontak{font-size:12px;color:var(--pudar)}

/* mode rapat */
.rapat{position:fixed;inset:0;z-index:90;background:var(--latar);overflow:auto;display:flex;flex-direction:column}
.rapat-kepala{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--biru);color:#fff;padding:14px 28px;position:sticky;top:0;z-index:2}
.rapat-kepala b{font-size:22px;display:block}
.rapat-kepala span{color:#DCE3F5;font-size:14px}
.rapat-titik{display:flex;gap:8px}
.rapat-titik button{width:12px;height:12px;border-radius:50%;border:0;background:rgba(255,255,255,.35);cursor:pointer;padding:0}

.rapat-tombol{display:flex;gap:6px}
.rapat-tombol button{width:44px;height:44px;border-radius:22px;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:20px;cursor:pointer}
.rapat-tombol button:hover{background:rgba(255,255,255,.25)}
.rapat-isi{padding:24px 28px 40px;display:flex;flex-direction:column;gap:18px;max-width:1700px;width:100%;margin:0 auto;box-sizing:border-box;zoom:1.12}

.rapat .btn.polos,.rapat [data-a="hubungiIds"]{display:none}

@media (max-width:760px){.grid3{grid-template-columns:minmax(0,1fr)}.matriks{grid-template-columns:96px repeat(4,minmax(0,1fr))}}

svg.grafik .lbl{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}

.lensa-blok{border-top:1px solid var(--garis);margin-top:14px;padding-top:14px;display:flex;flex-direction:column;gap:6px}
.btn-sinkron{display:flex;align-items:center;gap:8px;width:100%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:8px 10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:8px;flex-wrap:wrap;text-align:left}
.btn-sinkron svg{width:16px;height:16px}
.btn-sinkron small{flex-basis:100%;font-weight:400;font-size:11px;opacity:.8;margin-left:24px;margin-top:-4px}
.btn-sinkron:hover{background:rgba(255,255,255,.2)}.btn-sinkron:disabled{opacity:.6;cursor:default}

(function () {

 * ========================================================================== */

var VERSI = '1.3.5';
var UJI = { hariIni: null, jam: null };

var NAMA_BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
var NAMA_BULAN_PENDEK = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
var NAMA_HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
var BULAN_SINGKAT = { jan: 1, feb: 2, mar: 3, apr: 4, mei: 5, may: 5, jun: 6, jul: 7, agu: 8, ags: 8, agt: 8, aug: 8, sep: 9, okt: 10, oct: 10, nov: 11, des: 12, dec: 12 };
var KECAMATAN = ['BATUMARMAR', 'GALIS', 'KADUR', 'LARANGAN', 'PADEMAWU', 'PAKONG', 'PALENGAAN', 'PAMEKASAN', 'PASEAN', 'PEGANTENAN', 'PROPPO', 'TLANAKAN', 'WARU'];

function pad2(n) { n = String(n); return n.length < 2 ? '0' + n : n; }

function norm(s) {
  return String(s === null || s === undefined ? '' : s).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
}

var SINGKATAN = { pp: 1, cv: 1, pt: 1, ud: 1, kh: 1, nu: 1, mwc: 1, tpq: 1, mi: 1, mts: 1, ma: 1, sd: 1, smp: 1, sma: 1, smk: 1, ra: 1, tk: 1, paud: 1, bumdes: 0, sppg: 1 };
function judulKata(s) {
  return String(s || '').toLowerCase().replace(/\s+/g, ' ').trim()
    .replace(/(^|[\s\-\.\(\/'])([a-z])/g, function (m, a, b) { return a + b.toUpperCase(); })
    .replace(/\b([A-Za-z]{2,4})\b/g, function (w) { return SINGKATAN[w.toLowerCase()] ? w.toUpperCase() : w; });
}

function keAngka(v, desimal) {
  if (v === null || v === undefined) return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  var s = String(v).trim().replace(/\s/g, '').replace(/^rp\.?/i, '');
  if (!s || s === '-' || s === '--') return null;
  var neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (s.charAt(0) === '-') { neg = true; s = s.slice(1); }
  var titik = s.indexOf('.') >= 0, koma = s.indexOf(',') >= 0;
  if (titik && koma) {
    if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
    else s = s.replace(/,/g, '');
  } else if (koma) {
    if (/^\d{1,3}(,\d{3})+$/.test(s) && !desimal) s = s.replace(/,/g, '');
    else if (/^\d{1,3}(,\d{3}){2,}$/.test(s)) s = s.replace(/,/g, '');
    else s = s.replace(',', '.');
  } else if (titik) {
    if (/^\d{1,3}(\.\d{3})+$/.test(s) && !desimal) s = s.replace(/\./g, '');
    else if (/^\d{1,3}(\.\d{3}){2,}$/.test(s)) s = s.replace(/\./g, '');
  }
  if (!/^\d*\.?\d+$/.test(s)) return null;
  var n = parseFloat(s);
  return neg ? -n : n;
}

function bulat(v) { var a = keAngka(v); return a === null ? null : Math.round(a); }
function tahun4(y) { y = String(y); return y.length === 2 ? (+y > 50 ? '19' : '20') + y : y; }

function ymd(y, m, d) {
  y = +y; m = +m; d = +d;
  if (!y || m < 1 || m > 12 || d < 1 || d > 31) return '';
  return y + '-' + pad2(m) + '-' + pad2(d);
}

/** Tanggal apa pun → 'YYYY-MM-DD' ('' bila tidak terbaca). Angka = nomor seri tanggal Excel. */
function keTanggal(v) {
  if (v === null || v === undefined || v === '') return '';
  if (v instanceof Date) return isNaN(v.getTime()) ? '' : ymd(v.getFullYear(), v.getMonth() + 1, v.getDate());
  if (typeof v === 'number') {
    if (v > 20000 && v < 80000) {
      var d = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 86400000);
      return ymd(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate());
    }
    return '';
  }
  var s = String(v).trim().toLowerCase().replace(/[t\s]+\d{1,2}[:.]\d{2}([:.]\d{2})?.*$/, '');
  var m;
  if ((m = s.match(/^(\d{4})[\-\/\.](\d{1,2})[\-\/\.](\d{1,2})$/))) return ymd(m[1], m[2], m[3]);
  if ((m = s.match(/^(\d{1,2})[\-\/\.](\d{1,2})[\-\/\.](\d{2}|\d{4})$/))) return ymd(tahun4(m[3]), m[2], m[1]);
  if ((m = s.match(/^(\d{1,2})[\-\/\. ]([a-z]{3})[a-z]*[\-\/\. ](\d{2}|\d{4})$/))) {
    var b = BULAN_SINGKAT[m[2]];
    if (b) return ymd(tahun4(m[3]), b, m[1]);
  }
  return '';
}

/** Bulan-tahun apa pun → 'YYYY-MM' ('' bila tidak terbaca). */
function keBlth(v) {
  if (v === null || v === undefined || v === '') return '';
  if (v instanceof Date) return isNaN(v.getTime()) ? '' : v.getFullYear() + '-' + pad2(v.getMonth() + 1);
  var s = String(v).trim().toLowerCase();
  var m, bln;
  if ((m = s.match(/^(\d{1,2})[\-\/\.](\d{4})$/))) bln = [m[2], m[1]];
  else if ((m = s.match(/^(\d{4})[\-\/\.](\d{1,2})$/))) bln = [m[1], m[2]];
  else if ((m = s.match(/^([a-z]{3})[a-z]*[\-\/\. ](\d{2}|\d{4})$/)) && BULAN_SINGKAT[m[1]]) bln = [tahun4(m[2]), BULAN_SINGKAT[m[1]]];
  else if ((m = s.match(/^((?:19|20)\d{2})(0[1-9]|1[0-2])$/))) bln = [m[1], m[2]];
  else if ((m = s.match(/^(0[1-9]|1[0-2])((?:19|20)\d{2})$/))) bln = [m[2], m[1]];
  if (bln) {
    var bb = +bln[1];
    return (bb >= 1 && bb <= 12) ? bln[0] + '-' + pad2(bb) : '';
  }
  var t = keTanggal(v);
  return t ? t.slice(0, 7) : '';
}

function keYT(v) {
  var s = String(v === null || v === undefined ? '' : v).trim().toUpperCase();
  if (/^(Y|YA|YES|TRUE|1)$/.test(s)) return 'Y';
  if (/^(T|TIDAK|N|NO|FALSE|0)$/.test(s)) return 'T';
  return '';

/* ----------------------------------------------------------------------
 *  Pembaca file Excel (.xlsx) sederhana tanpa pustaka luar.
 *  .xlsx = arsip zip berisi XML. Isi zip dibuka dengan DecompressionStream
 *  bawaan browser. Hanya lembar pertama yang berisi data yang dibaca.

function u16(b, i) { return b[i] | (b[i + 1] << 8); }

async function bukaZip(buf) {

    if (u32(b, i) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('File Excel rusak atau bukan .xlsx (simpan ulang sebagai .xlsx atau CSV).');
  var n = u16(b, eocd + 10), off = u32(b, eocd + 16), isi = {};
  for (var k = 0; k < n; k++) {
    if (u32(b, off) !== 0x02014b50) break;
    var metode = u16(b, off + 10), ukKomp = u32(b, off + 20);
    var pjNama = u16(b, off + 28), pjEkstra = u16(b, off + 30), pjKom = u16(b, off + 32), lokal = u32(b, off + 42);
    var nama = new TextDecoder().decode(b.subarray(off + 46, off + 46 + pjNama));

    off += 46 + pjNama + pjEkstra + pjKom;

  return {
    ada: function (nama) { return !!isi[nama]; },
    teks: async function (nama) {
      var e = isi[nama];
      if (!e) return '';
      var mulai = e.lokal + 30 + u16(b, e.lokal + 26) + u16(b, e.lokal + 28);
      var data = b.subarray(mulai, mulai + e.ukKomp);
      if (e.metode === 0) return new TextDecoder().decode(data);
      if (e.metode !== 8) throw new Error('Format kompresi Excel tidak didukung. Simpan ulang sebagai CSV.');
      if (typeof DecompressionStream === 'undefined') throw new Error('Browser ini belum bisa membuka .xlsx. Pakai Chrome/Edge terbaru, atau simpan sebagai CSV.');

function uraiEntitas(s) {
  return String(s).replace(/&(#x[0-9a-f]+|#\d+|lt|gt|amp|quot|apos);/gi, function (m, e) {

        if (teks.charAt(i + 1) === '"') { sel += '"'; i += 2; continue; }
        kutip = false; i++; continue;
      }
      sel += ch; i++; continue;
    }
    if (ch === '"' && sel === '') { kutip = true; i++; continue; }
    if (ch === pemisah) { row.push(sel); sel = ''; i++; continue; }
    if (ch === '\r') { i++; continue; }
    if (ch === '\n') { row.push(sel); baris.push(row); row = []; sel = ''; i++; continue; }
    sel += ch; i++;
  }
  if (sel !== '' || row.length) { row.push(sel); baris.push(row); }
  return baris.map(function (r) { return r.map(function (x) { return String(x).trim(); }); });
}

function deteksiPemisah(teks) {
  var contoh = String(teks || '').split(/\r?\n/).slice(0, 60).join('\n');
  var terbaik = ',', skor = -1;
  [',', ';', '\t', '|'].forEach(function (p) {
    var g = uraiCsv(contoh, p);
    var lebar = g.map(function (r) { return r.length; }).sort(function (a, b) { return b - a; });
    var s = lebar.length ? lebar[Math.floor(lebar.length / 4)] : 0;
    if (s > skor) { skor = s; terbaik = p; }
  });
  return terbaik;
}

function barisData(row) {
  var adaNpp = false, adaBlth = false, adaTgl = false, adaBulan = false, angka = 0;
  for (var i = 0; i < row.length; i++) {
    var x = String(row[i] || '').trim();
    if (!x) continue;
    if (/^(jan|feb|mar|apr|mei|may|jun|jul|agu|ags|aug|sep|okt|oct|nov|des|dec)$/i.test(x)) adaBulan = true;
    if (keAngka(x) !== null) angka++;
    if (/^[A-Z]{2}\d{6}$/i.test(x)) adaNpp = true;
    else if (/^\d{7,8}$/.test(x) && !/^(19|20)\d{2}(0[1-9]|1[0-2])([0-2]\d|3[01])$/.test(x)) adaNpp = true;
    else if (/^\d{1,2}[\-\/]\d{4}$/.test(x)) adaBlth = true;
    else if (/^\d{1,2}[\-\/]\d{1,2}[\-\/]\d{2,4}$/.test(x)) adaTgl = true;
  }
  return adaNpp || (adaBlth && adaTgl) || (adaBulan && angka >= 8);
}

function barisJudulKelompok(row) {
  var isi = row.filter(function (x) { return String(x || '').trim() !== ''; });
  if (isi.length < 2) return false;
  for (var i = 0; i < isi.length; i++) if (String(isi[i]).indexOf(':') >= 0) return false;
  return true;
}

function analisaGrid(grid, namaFile) {
  var semua = aliasSemua();
  var terbaik = -1, skorTerbaik = 0;
  var batas = Math.min(grid.length, 80);
  for (var r = 0; r < batas; r++) {
    var skor = 0;
    for (var c = 0; c < grid[r].length; c++) {
      var h = norm(grid[r][c]);
      if (h && semua[h]) skor++;
    }
    if (skor > skorTerbaik) { skorTerbaik = skor; terbaik = r; }
  }
  if (skorTerbaik < 3) {
    terbaik = -2;
    for (var rr = 0; rr < batas; rr++) if (barisData(grid[rr])) { terbaik = rr - 1; break; }
    if (terbaik === -2) throw new Error('Judul kolom laporan tidak ditemukan dan tidak ada baris NPP. Pastikan file adalah hasil ekspor laporan sistem (CSV/XLSX).');
  }
  var mulai = -1;
  for (var r2 = terbaik + 1; r2 < grid.length; r2++) if (barisData(grid[r2])) { mulai = r2; break; }
  if (mulai < 0) throw new Error('Tidak ada baris data (NPP) di bawah judul kolom.');

  var atas = terbaik < 0 ? mulai : terbaik;
  for (var k = 1; k <= 4 && terbaik >= 0 && terbaik - k >= 0; k++) {
    if (barisJudulKelompok(grid[terbaik - k])) atas = terbaik - k;
    else break;
  }
  var lebar = 0;
  for (var r3 = atas; r3 < Math.min(grid.length, mulai + 5); r3++) lebar = Math.max(lebar, grid[r3].length);
  var bagian = [], gabung = [];
  for (var c2 = 0; c2 < lebar; c2++) {
    var p = [];
    for (var r4 = atas; r4 < mulai; r4++) { var t = norm(grid[r4][c2]); if (t) p.push(t); }
    bagian.push(p);
    gabung.push(p.join(' '));
  }
  var dataPertama = grid[mulai], lebarData = 0;
  for (var c3 = 0; c3 < dataPertama.length; c3++) if (String(dataPertama[c3]).trim() !== '') lebarData = c3 + 1;
  var luar = grid.slice(0, atas).map(function (x) { return x.join(' '); });
  for (var r5 = mulai; r5 < grid.length; r5++) if (!barisData(grid[r5])) luar.push(grid[r5].join(' '));
  var an = { kepala: terbaik, atas: atas, mulai: mulai, lebar: lebar, lebarData: lebarData, bagian: bagian, gabung: gabung, judulTeks: luar.join('\n'), namaFile: namaFile || '' };
  an.jenis = tebakJenis(gabung.join(' | '), namaFile);
  return an;
}

function tebakJenis(teks, namaFile) {
  var t = ' ' + teks + ' ';
  if (/kontak utama/.test(t) && /(status bayar|segmen)/.test(t)) return 'LENSA_STATUS';
  if (/pkbu itw/.test(t) && /menunggak/.test(t)) throw new Error('Ini laporan KPI084 (rekap migrasi). Monitor SPPG memakai ITW/ITB, Monitoring, atau Data Badan Usaha.');
  if (/ koef/.test(t) && / itb /.test(t)) return 'ITW_ITB';
  if (/kecukupan ibr/.test(t) && /(blm posting|belum posting|penilaian)/.test(t)) return 'ITW_ITB';
  if (/blth iuran/.test(t) && /(tanggal|tgl) bayar/.test(t)) throw new Error('Ini Kartu Iuran satu NPP. Monitor SPPG memakai ITW/ITB, Monitoring, atau Data Badan Usaha.');
  if (/(penambahan|pengurangan)/.test(t) && /aktif/.test(t)) return 'MONITORING';
  if (/(nama ilo|kode ilo|rate jkk)/.test(t)) return 'DATA_BU';
  var f = String(namaFile || '').toLowerCase();
  if (/status.?pk/.test(f)) return 'LENSA_STATUS';
  if (/itw|itb/.test(f)) return 'ITW_ITB';
  if (/monitor/.test(f)) return 'MONITORING';
  if (/badan.?usaha|dbu|data.?bu/.test(f)) return 'DATA_BU';
  throw new Error('Jenis laporan tidak dikenali dari judul kolom maupun nama file.');
}

function cariKolom(an, alias, dipakai) {
  var m = String(alias).match(/^(.*?)(\*)?(?:#(\d+))?$/);
  var a = norm(m[1]), awalan = !!m[2], ke = m[3] ? +m[3] : 1, berurut = !!m[3];
  if (!a) return -1;
  var cocok = [], c;
  var sama = function (c) { return an.gabung[c] === a || an.bagian[c].indexOf(a) >= 0; };
  var memuat = function (c) { return (' ' + an.gabung[c] + ' ').indexOf(' ' + a + ' ') >= 0; };
  if (awalan) {
    for (c = 0; c < an.lebar; c++) if (an.gabung[c].indexOf(a) === 0 || an.bagian[c].some(function (p) { return p.indexOf(a) === 0; })) cocok.push(c);
    return cocok.length >= ke ? cocok[ke - 1] : -1;
  }
  if (berurut) {
    for (c = 0; c < an.lebar; c++) if (sama(c) || memuat(c)) cocok.push(c);
    return cocok.length >= ke ? cocok[ke - 1] : -1;
  }
  for (c = 0; c < an.lebar; c++) { if (!dipakai[c] && sama(c)) cocok.push(c); }
  if (!cocok.length) {
    for (c = 0; c < an.lebar; c++) { if (!dipakai[c] && memuat(c)) cocok.push(c); }
    cocok.sort(function (x, y) { return x - y; });
  }
  return cocok.length >= ke ? cocok[ke - 1] : -1;
}

var TIPE_KOLOM = {
  no: 'bulat', npp: 'npp', div: 'div', nama: 'teks', kci: 'kode', kcp: 'kode', pembina: 'pembina',
  blth_keps: 'blth', blth_na: 'blth', kategori: 'teks', rate_jkk: 'desimal', kode_ilo: 'ilo', nama_ilo: 'teks',
  total_upah: 'angka', blth_iuran: 'blth', jumlah_iuran: 'angka', alamat: 'teks', kabupaten: 'teks', kode_area: 'digit',
  telp: 'digit', pic_nama: 'teks', pic_jabatan: 'teks', pic_hp: 'digit', pic_email: 'email',
  blth_posting: 'blth', iuran_terakhir: 'angka', periode_nilai: 'blth', bln_belum_posting: 'bulat', ibr_nilai: 'angka',
  ibr_bulan: 'bulat', koef: 'bulat', itw: 'yt', itb: 'yt',
  keps_awal: 'blth', keps_jp: 'blth', skala: 'skala', prog: 'prog', tk_tambah: 'bulat', tk_kurang: 'bulat', tk_aktif: 'bulat',
  tk_na: 'bulat', tk_jumlah: 'bulat', iuran_berjalan: 'angka', tgl_terima: 'tgl', blth_entri: 'blth', nilai_posting: 'angka',
  sipp_prs: 'sipp', ibr_ijt: 'angka', ibr_idm: 'angka'
};
var SERING_KOSONG = { blth_na: 1, kategori: 1, keps_jp: 1, prog: 1 };

function cocokTipe(tipe, x) {
  switch (tipe) {
    case 'bulat': return /^-?(\d{1,3}(,\d{3})+|\d+)$/.test(x);
    case 'angka': return keAngka(x) !== null;
    case 'desimal': var a = keAngka(x, true); return a !== null && a < 100;
    case 'digit': return /^[\d\s\-\+\(\)\/]{3,}$/.test(x) || rusakExcel(x);
    case 'ilo': return /^\d{3,5}$/.test(x);
    case 'blth': return !!keBlth(x) && !keTanggal(x) && !/^\d+$/.test(x);
    case 'tgl': return !!keTanggal(x);
    case 'teks': return /[A-Za-z]{2,}/.test(x) && !keBlth(x) && x.indexOf('@') < 0 && !/^(ya|tidak)$/i.test(x);
    case 'email': return x.indexOf('@') > 0;
    case 'npp': return !!rapikanNpp(x);
    case 'div': return /^\d{1,3}$/.test(x);
    case 'kode': return /^[A-Z]\d{2}$/i.test(x);
    case 'pembina': return /^[A-Z]{2}\d{6}/i.test(x) || (/[A-Za-z]{3,}/.test(x) && !keBlth(x));
    case 'yt': return /^(Y|T)$/i.test(x);
    case 'skala': return /^(B|Mn|K|Mi|MI|M)$/.test(x);
    case 'prog': return /^\dP$/i.test(x);
    case 'sipp': return /^(-|sipp|prs|sipp\/prs)$/i.test(x);
  }
  return true;
}

function barisContoh(an, grid) {
  var out = [];
  for (var r = an.mulai; r < grid.length && out.length < 150; r++) if (barisData(grid[r])) out.push(grid[r]);
  return out;
}

function skorPeta(jenis, peta, contoh) {
  var def = pemetaan(jenis), wajib = {};
  def.forEach(function (d) { if (d.wajib) wajib[d.kolom] = true; });
  var total = 0, ok = true, buruk = [];
  Object.keys(peta).forEach(function (k) {
    var tipe = TIPE_KOLOM[k];
    if (!tipe) return;
    var isi = 0, pas = 0;
    contoh.forEach(function (row) {
      var x = String(row[peta[k]] === undefined ? '' : row[peta[k]]).trim();
      if (!x) return;
      isi++;
      if (cocokTipe(tipe, x)) pas++;
    });
    total += pas - (isi - pas);
    if (wajib[k] && (!isi || pas / isi < 0.8)) { ok = false; buruk.push(k); }
  });
  return { total: total, ok: ok, buruk: buruk };
}

function petakanIsi(jenis, contoh) {
  var urut = URUTAN_KOLOM[jenis];
  if (!urut || !contoh.length) return null;
  var lebar = 0;
  contoh.forEach(function (r) { lebar = Math.max(lebar, r.length); });
  var slot = [];
  for (var c = 0; c < lebar; c++) {
    if (contoh.some(function (r) { return String(r[c] === undefined ? '' : r[c]).trim() !== ''; })) slot.push(c);
  }
  var def = pemetaan(jenis), wajib = {};
  def.forEach(function (d) { if (d.wajib) wajib[d.kolom] = true; });
  var nilai = {};
  function skor(i, j) {
    var key = i + '|' + j;
    if (nilai[key] !== undefined) return nilai[key];
    var tipe = TIPE_KOLOM[urut[i]], isi = 0, pas = 0;
    contoh.forEach(function (r) {
      var x = String(r[slot[j]] === undefined ? '' : r[slot[j]]).trim();
      if (!x) return;
      isi++;
      if (!tipe || cocokTipe(tipe, x)) pas++;
    });
    return (nilai[key] = isi ? pas / isi : 0);
  }
  var n = urut.length, m = slot.length, NEG = -1e9, dp = [], dari = [], i, j;
  for (i = 0; i <= n; i++) { dp.push([]); dari.push([]); for (j = 0; j <= m; j++) { dp[i].push(NEG); dari[i].push(''); } }
  dp[0][0] = 0;
  for (i = 0; i <= n; i++) {
    for (j = 0; j <= m; j++) {
      var v = dp[i][j];
      if (v === NEG) continue;
      if (i < n && j < m) { var a = v + skor(i, j); if (a > dp[i + 1][j + 1]) { dp[i + 1][j + 1] = a; dari[i + 1][j + 1] = 'p'; } }
      if (i < n) { var b = v - (wajib[urut[i]] ? 3 : SERING_KOSONG[urut[i]] ? 0.1 : 0.4); if (b > dp[i + 1][j]) { dp[i + 1][j] = b; dari[i + 1][j] = 'k'; } }
      if (j < m) { var d = v - 0.6; if (d > dp[i][j + 1]) { dp[i][j + 1] = d; dari[i][j + 1] = 's'; } }
    }
  }
  var peta = {};
  i = n; j = m;
  while (i > 0 || j > 0) {
    var arah = dari[i][j];
    if (arah === 'p') { peta[urut[i - 1]] = slot[j - 1]; i--; j--; }
    else if (arah === 'k') i--;
    else j--;
  }
  delete peta.no;
  return peta;
}

function petakanJudul(an) {
  var def = pemetaan(an.jenis), peta = {}, dipakai = {};
  def.forEach(function (d) {
    var c = -1;
    for (var i = 0; i < d.alias.length && c < 0; i++) c = cariKolom(an, d.alias[i], dipakai);
    if (c >= 0) { peta[d.kolom] = c; dipakai[c] = true; }
  });
  var kurang = def.filter(function (d) { return d.wajib && peta[d.kolom] === undefined; }).map(function (d) { return d.kolom; });
  if (kurang.length) {
    var urut = URUTAN_KOLOM[an.jenis];
    if (urut && (an.lebarData === urut.length || an.lebar === urut.length)) {
      peta = {};
      urut.forEach(function (k, i) { peta[k] = i; });
      kurang = [];
      an.posisi = true;
    }
  }
  if (kurang.length) {
    throw new Error('Kolom wajib tidak ditemukan: ' + kurang.join(', ') + '. Judul kolom di file: ' + an.gabung.filter(String).join(' | '));
  }
  return peta;
}

function petakanKolom(an, grid) {
  var contoh = grid ? barisContoh(an, grid) : [];
  var judul = null, galatJudul = null;
  try { judul = petakanJudul(an); } catch (e) { galatJudul = e; }
  if (!contoh.length || !URUTAN_KOLOM[an.jenis]) { if (galatJudul) throw galatJudul; return judul; }
  var sJudul = judul ? skorPeta(an.jenis, judul, contoh) : null;
  var isi = petakanIsi(an.jenis, contoh);
  var sIsi = isi ? skorPeta(an.jenis, isi, contoh) : null;
  if (sJudul && sJudul.ok && (!sIsi || !sIsi.ok || sIsi.total <= sJudul.total * 1.05)) return judul;
  if (sIsi && sIsi.ok) { an.posisi = false; an.menurutIsi = true; return isi; }
  if (galatJudul) throw galatJudul;
  throw new Error('Isi kolom tidak sesuai dengan laporan ' + NAMA_LAPORAN[an.jenis] + ' (kolom bermasalah: ' + ((sJudul && sJudul.buruk) || []).join(', ') + ').');
}

function ambilBaris(an, peta, grid) {
  var out = [], prev = null;
  for (var r = an.mulai; r < grid.length; r++) {
    var row = grid[r], o = {};
    Object.keys(peta).forEach(function (k) { var x = row[peta[k]]; o[k] = x === undefined || x === null ? '' : String(x).trim(); });
    var npp = rapikanNpp(o.npp);
    if (npp) { o.npp = npp; o.div = rapikanDiv(o.div); out.push(o); prev = o; continue; }
    var isi = row.filter(function (x) { return String(x || '').trim() !== ''; });
    if (!isi.length) { prev = null; continue; }
    var adaTitikDua = isi.some(function (x) { return String(x).indexOf(':') >= 0 || /^-/.test(String(x).trim()); });
    if (prev && an.jenis === 'DATA_BU' && !adaTitikDua) {
      ['nama', 'alamat', 'pic_nama', 'pic_jabatan'].forEach(function (k) { if (o[k]) prev[k] = (prev[k] ? prev[k] + ' ' : '') + o[k]; });
      if (o.pic_email) prev.pic_email = (prev.pic_email || '') + o.pic_email;
    } else prev = null;
  }
  return out;
}

function tentukanPeriode(an) {
  var t = an.judulTeks || '', m, cetak = '';
  m = t.match(/(?:tanggal cetak|tgl\.? cetak|tanggal|tgl)\s*:?\s*(\d{1,2}[\-\/\.]\d{1,2}[\-\/\.]\d{2,4})/i);
  if (m) cetak = keTanggal(m[1]);
  if (!cetak) {
    m = t.match(/periode\s*:?\s*(\d{1,2}[\-\/\. ][a-z]{3}[a-z]*[\-\/\. ]\d{2,4})/i);
    if (m) cetak = keTanggal(m[1]);
  }
  if (!cetak) {
    var f = an.namaFile || '';
    m = f.match(/((?:19|20)\d{2})[\-_\.]?(0[1-9]|1[0-2])[\-_\.]?([0-2]\d|3[01])/);
    if (m) cetak = ymd(m[1], m[2], m[3]);
    else if ((m = f.match(/([0-2]\d|3[01])[\-_\.](0[1-9]|1[0-2])[\-_\.]((?:19|20)\d{2})/))) cetak = ymd(m[3], m[2], m[1]);
  }
  var dariJudul = !!cetak;
  if (!cetak || cetak > hariIni()) cetak = hariIni();
  var lap = '';
  m = t.match(/periode\s*:?\s*(\d{1,2}[\-\/]\d{4})(?!\d)/i);
  if (m) lap = keBlth(m[1]);
  var pembina = '';
  m = t.match(/pembina\s*:?\s*([A-Z]{2}\d{6})/i);
  if (m) pembina = m[1].toUpperCase();
  return { tanggal: cetak, dariJudul: dariJudul, laporan: lap, pembina: pembina };
}

function cekPosisi(jenis, data) {
  var uji = {
    ITW_ITB: function (o) { return keBlth(o.periode_nilai) && keYT(o.itw) && keYT(o.itb); },
    MONITORING: function (o) { return (!o.blth_posting || keBlth(o.blth_posting)) && (!o.tgl_terima || keTanggal(o.tgl_terima)) && /^(B|Mn|K|Mi|MI|)$/.test(String(o.skala).trim()); },
    DATA_BU: function (o) { return keAngka(o.total_upah) !== null && (!o.blth_iuran || keBlth(o.blth_iuran)); }
  }[jenis];
  if (!uji) return;
  var cocok = data.filter(uji).length;
  if (cocok < data.length * 0.9) {
    throw new Error('Judul kolom tidak dikenali dan isi kolom tidak sesuai urutan ' + NAMA_LAPORAN[jenis] + ' (' + cocok + ' dari ' + data.length + ' baris cocok).');
  }
}

/* ----------------------- SPPG & nama ----------------------- */

function adalahSppg(nama) {
  var n = ' ' + String(nama || '').toUpperCase().replace(/[^A-Z0-9]+/g, ' ') + ' ';
  return / SPPG |PEMENUHAN GIZI/.test(n);
}

/** Nama resmi → { jenis: Pengurus/Relawan/'', inti: nama tanpa awalan & akhiran program } */
function intiNama(nama) {
  var up = String(nama || '').toUpperCase().replace(/\s+/g, ' ').trim(), jenis = '';
  var m = up.match(/^(PENGURUS|RELAWAN)\s+/);
  if (m) { jenis = m[1] === 'PENGURUS' ? 'Pengurus' : 'Relawan'; up = up.slice(m[0].length); }
  up = up.replace(/\s+\dP$/, '').trim();
  return { jenis: jenis, inti: up };
}

function kunciUnit(inti) { return 'U:' + norm(inti); }

/** 'SPPG PAMEKASAN LARANGAN LARANGAN LUAR YAYASAN DAYA BHAKTI PERSADA' → label Larangan Luar, kec Larangan, yayasan Daya Bhakti Persada */
function uraiNamaSppg(inti) {
  var t = String(inti || '').toUpperCase().replace(/\s+/g, ' ').trim()
    .replace(/^(SPPG|SATUAN PELAYANAN PEMENUHAN GIZI)\s+/, '').replace(/^PAMEKASAN\s+/, '')
    .replace(/\b(AL|AS|AN|AR|AZ|AT|ASY|ADZ)\s*-\s*(?=[A-Z])/g, '$1-');
  var yayasan = '', m = t.match(/(?:\s+-)?\s*\b(?:YAYASAN|YYS)\b\.?\s+(.*)$/);
  if (m && m.index > 0) {
    yayasan = m[1].replace(/^(YAY|YAYASAN|YYS)\.?\s+/, '');
    t = t.slice(0, m.index);
  }
  t = t.replace(/[\s\-]+$/, '').trim();
  var kata = t.split(' '), kec = '', label = t, lembaga = '';
  var i = -1;
  for (var k = 0; k < kata.length; k++) if (KECAMATAN.indexOf(kata[k]) >= 0) { i = k; break; }
  if (i === 0) { kec = kata[0]; label = kata.slice(1).join(' ') || kata[0]; }
  else if (i > 0) { kec = kata[i]; lembaga = kata.slice(0, i).join(' '); label = kata.slice(i + 1).join(' ') || kata[i]; }
  if (!yayasan && lembaga) yayasan = lembaga;
  // tanpa kata YAYASAN: nama lembaga berawalan Al-/As-/An- di ujung nama dianggap nama yayasan (mis. "KADUARA BARAT AS-SALMAN")
  var mm = !yayasan && label.match(/^(.*\S)\s+((?:AL|AS|AN|AR|AZ|AT|ASY|ADZ)-\S+(?:\s+\S+)*)$/);
  if (mm) { label = mm[1]; yayasan = mm[2]; }
  return { label: judulKata(label), yayasan: judulKata(yayasan), kecamatan: judulKata(kec) };
}

/** Nama SPPG yang diketik bebas (rekap pendaftaran) → label pendek yang sama dengan label dari laporan. */
function labelBebas(nama) {
  var t = String(nama || '').replace(/\s+/g, ' ').trim();
  if (/yayasan|^sppg\s+pamekasan/i.test(t)) return uraiNamaSppg(intiNama(t).inti);
  return { label: judulKata(t.replace(/^(SPPG|SATUAN PELAYANAN PEMENUHAN GIZI)\s+/i, '')), yayasan: '', kecamatan: '' };
}

function kunciYayasan(y) { return norm(String(y || '').replace(/\b(pamekasan|madura)\s*$/i, '')); }

/** Membaca berkas (CSV/TXT/XLSX) menjadi grid sel. */
async function bacaBerkas(file) {
  var nama = file.name || 'berkas';
  if (/\.xlsx$/i.test(nama)) return bacaXlsx(await file.arrayBuffer());
  if (/\.xls$/i.test(nama)) throw new Error('Format .xls lama belum didukung. Buka di Excel lalu Simpan Sebagai .xlsx atau CSV.');
  var buf = await file.arrayBuffer();
  var teks = new TextDecoder('utf-8').decode(buf);
  if (teks.indexOf('�') >= 0) teks = new TextDecoder('windows-1252').decode(buf);
  return uraiCsv(teks, deteksiPemisah(teks));
}

/**
 * Grid laporan sistem → { jenis, periode, pembina, rows, total, sppg, cek }.
 * rows hanya baris SPPG (atau NPP yang sudah ditautkan ke SPPG secara manual).
 */
function uraiLaporan(namaFile, grid, nppDikenal) {
  var an = analisaGrid(grid, namaFile);
  var peta = petakanKolom(an, grid);
  var data = ambilBaris(an, peta, grid);
  if (!data.length) throw new Error('Tidak ada baris data yang terbaca.');
  if (an.posisi) cekPosisi(an.jenis, data);
  var per = tentukanPeriode(an);
  nppDikenal = nppDikenal || {};
  var sppg = data.filter(function (r) {
    if (an.jenis === 'LENSA_STATUS') return /sppg/i.test(r.segmen || '') || adalahSppg(r.nama) || nppDikenal[r.npp];
    return adalahSppg(r.nama) || nppDikenal[r.npp];
  });
  var hasil = { jenis: an.jenis, periode: per.tanggal, pembina: per.pembina, total: data.length, rows: [], cek: '' };
  if (an.posisi) hasil.cek = 'kolom dibaca menurut urutan';
  if (an.menurutIsi) hasil.cek = 'format Excel: kolom dibaca menurut isinya';
  if (an.jenis === 'ITW_ITB') uraiItw(sppg, per, hasil);
  else if (an.jenis === 'MONITORING') uraiMonitoring(sppg, per, hasil, namaFile);
  else if (an.jenis === 'DATA_BU') uraiDbu(sppg, hasil);
  else uraiLensaStatus(sppg, hasil);
  return hasil;
}

function uraiItw(data, per, hasil) {
  var salah = [], lihat = {};
  data.forEach(function (r) {
    if (lihat[r.npp]) return;
    lihat[r.npp] = true;
    var o = {
      npp: r.npp, div: r.div, nama: String(r.nama || '').replace(/\s+/g, ' ').trim(),
      pembina: (String(r.pembina || '').toUpperCase().match(/[A-Z]{2}\d{6}/) || [per.pembina || ''])[0],
      bp: keBlth(r.blth_posting), iuran: keAngka(r.iuran_terakhir) || 0, pn: keBlth(r.periode_nilai),
      bln: bulat(r.bln_belum_posting), ibrN: keAngka(r.ibr_nilai) || 0, ibrB: bulat(r.ibr_bulan) || 0, koef: bulat(r.koef),
      itw: keYT(r.itw), itb: keYT(r.itb)
    };
    var catatan = [];
    if (o.pn && o.bp) {
      var bln = mIdx(o.pn) - mIdx(o.bp);
      if (o.bln === null) o.bln = bln;
      else if (bln !== o.bln) catatan.push('bln ' + o.bln + '≠' + bln);
    }
    if (o.bln !== null) {
      var koef = o.bln - o.ibrB;
      if (o.koef === null) o.koef = koef;
      else if (koef !== o.koef) catatan.push('koef ' + o.koef + '≠' + koef);
      var itb = o.bln <= 0 ? 'Y' : 'T';
      if (!o.itb) o.itb = itb; else if (itb !== o.itb) catatan.push('ITB ' + o.itb + '≠' + itb);
    }
    if (o.koef !== null) {
      var itw = o.koef <= 1 ? 'Y' : 'T';
      if (!o.itw) o.itw = itw; else if (itw !== o.itw) catatan.push('ITW ' + o.itw + '≠' + itw);
    }
    if (o.koef === null || o.bln === null) catatan.push('nilai kosong');
    if (catatan.length) salah.push(o.npp + ' (' + catatan.join(', ') + ')');
    hasil.rows.push(o);
  });
  if (salah.length > Math.max(2, Math.floor(hasil.rows.length / 100))) {
    throw new Error('Rumus ITW/ITB tidak cocok di ' + salah.length + ' dari ' + hasil.rows.length + ' baris, kemungkinan kolom tertukar. Contoh: ' + salah.slice(0, 3).join('; '));
  }
  var bulanNilai = hasil.rows.length ? hasil.rows[0].pn : '';
  if (!per.dariJudul && bulanNilai && bulanNilai !== hariIni().slice(0, 7)) {
    var akhir = bulanNilai + '-' + pad2(hariDalamBulan(bulanNilai));
    hasil.periode = akhir > hariIni() ? hariIni() : akhir;
  }
  var nItw = hasil.rows.filter(function (o) { return o.itw === 'Y'; }).length, nItb = hasil.rows.filter(function (o) { return o.itb === 'Y'; }).length;
  hasil.cek = [hasil.cek, 'NPP SPPG ' + hasil.rows.length + ' · ITW ' + nItw + ' · ITB ' + nItb, salah.length ? salah.length + ' baris rumus berbeda: ' + salah.slice(0, 2).join('; ') : ''].filter(String).join(' · ');
}

function uraiMonitoring(data, per, hasil, namaFile) {
  var lap = per.laporan;
  if (!lap) {
    var f = String(namaFile || ''), mf = f.match(/(?:^|[^\d])(0[1-9]|1[0-2])[\-_\.]((?:19|20)\d{2})(?!\d)/) || f.match(/((?:19|20)\d{2})[\-_\.](0[1-9]|1[0-2])(?!\d)/);
    lap = mf ? (mf[1].length === 4 ? mf[1] + '-' + mf[2] : mf[2] + '-' + mf[1]) : hasil.periode.slice(0, 7);
  }
  var byNpp = {};
  data.forEach(function (r) {
    var o = {
      npp: r.npp, div: r.div, nama: String(r.nama || '').replace(/\s+/g, ' ').trim(), keps: keBlth(r.keps_awal), na: keBlth(r.blth_na),
      skala: String(r.skala || '').trim(), prog: String(r.prog || '').trim().toUpperCase(), tk: keAngka(r.tk_aktif) || 0,
      tgl: keTanggal(r.tgl_terima), bp: keBlth(r.blth_posting), nilai: keAngka(r.nilai_posting) || 0, ijt: keAngka(r.ibr_ijt) || 0
    };
    var lama = byNpp[o.npp];
    if (!lama || (lama.na && !o.na)) byNpp[o.npp] = o;
  });
  hasil.rows = Object.keys(byNpp).map(function (k) { return byNpp[k]; });
  hasil.laporan = lap;
  var na = hasil.rows.filter(function (o) { return o.na; }).length;
  hasil.cek = [hasil.cek, 'NPP SPPG ' + hasil.rows.length + (na ? ' (' + na + ' nonaktif)' : '') + ' · periode ' + namaBulan(lap)].filter(String).join(' · ');
}

function uraiDbu(data, hasil) {
  var lihat = {}, rusak = 0;
  data.forEach(function (r) {
    if (lihat[r.npp]) return;
    lihat[r.npp] = true;
    var hp = String(r.pic_hp || '').trim();
    if (rusakExcel(hp) || /^\d{10,}$/.test(hp.replace(/\D/g, '')) && /0{5,}$/.test(hp)) { rusak++; hp = ''; }
    hasil.rows.push({

      picHp: hp, alamat: String(r.alamat || '').replace(/\s+/g, ' ').trim()
    });

  hasil.cek = [hasil.cek, 'NPP SPPG ' + hasil.rows.length, rusak ? rusak + ' nomor HP rusak oleh Excel (6.28E+12) dilewati' : ''].filter(String).join(' · ');
}

  });

/* ----------------------- rekap pendaftaran (manual) ----------------------- */

var STATUS_DAFTAR = ['Terdaftar aktif', 'Sudah setor data', 'Belum terdaftar'];

function statusDaftarDari(s) {
  var t = norm(s);
  if (!t) return '';
  if (/belum/.test(t) && /(daftar|terdaftar)/.test(t)) return 'Belum terdaftar';
  if (/(setor|tunggu|menunggu|proses|iuran pertama|belum bayar)/.test(t)) return 'Sudah setor data';
  if (/(aktif|terdaftar|sudah|ya)/.test(t)) return 'Terdaftar aktif';
  if (/(belum|tidak)/.test(t)) return 'Belum terdaftar';
  return '';
}

/**
 * Rekap pendaftaran dari Excel/CSV/tempelan. Judul kolom bebas; yang dicari:
 * nama SPPG, yayasan, kecamatan, desa, status, NPP, PIC/kepala, nomor WA/HP.
 */
function uraiPendaftaran(grid) {
  var cocokKolom = {
    nama: /^(nama )?sppg$|nama sppg|^nama$|^sppg|satuan pelayanan|unit/,
    yayasan: /yayasan|mitra/,
    kecamatan: /^kec|kecamatan/,
    desa: /^desa|kelurahan/,
    status: /status|keterangan|ket$/,
    npp: /npp/,
    pic: /pic|kepala|penanggung|nama ka|kontak|ka sppg/,
    wa: /wa\b|whatsapp|hp|telp|telepon|no hp|nomor/
  };
  var kepala = -1, peta = null;
  for (var r = 0; r < Math.min(grid.length, 30) && kepala < 0; r++) {
    var p = {}, skor = 0;
    (grid[r] || []).forEach(function (x, c) {
      var t = norm(x);
      if (!t) return;
      Object.keys(cocokKolom).forEach(function (k) {
        if (k === 'npp') { if (cocokKolom.npp.test(t)) { (p.npp = p.npp || []).push(c); skor++; } return; }
        if (p[k] === undefined && cocokKolom[k].test(t) && !(k === 'nama' && /pic|kepala|yayasan/.test(t)) && !(k === 'wa' && /npp/.test(t))) { p[k] = c; skor++; }
      });
    });
    if (p.nama !== undefined && skor >= 2) { kepala = r; peta = p; }
  }
  if (kepala < 0) throw new Error('Judul kolom rekap pendaftaran tidak ditemukan. Minimal ada kolom "Nama SPPG" dan satu kolom lain (Status, Yayasan, Kecamatan, PIC, atau No WA).');
  var out = [];
  for (var i = kepala + 1; i < grid.length; i++) {
    var row = grid[i] || [], ambil = function (k) { return peta[k] === undefined ? '' : String(row[peta[k]] || '').trim(); };
    var nama = ambil('nama');
    if (!nama || /^(total|jumlah)/i.test(nama)) continue;
    var npps = (peta.npp || []).map(function (c) { return rapikanNpp(row[c]); }).filter(String);
    out.push({ nama: nama, yayasan: ambil('yayasan').replace(/^(yayasan|yys\.?|yay\.?)\s+/i, ''), kecamatan: ambil('kecamatan'), desa: ambil('desa'), status: statusDaftarDari(ambil('status')), statusAsli: ambil('status'), npp: npps, picNama: ambil('pic'), picWa: ambil('wa') });
  }
  if (!out.length) throw new Error('Tidak ada baris SPPG di bawah judul kolom.');
  return out;
}

/* ----------------------- titipan laporan untuk LENSA PK ----------------------- */
var LAPORAN_LENSA = { ITW_ITB: true, MONITORING: true, DATA_BU: true };

/**
 * Grid laporan → grid untuk LENSA PK (hanya baris milik kode pembina LENSA), atau null bila bukan untuknya.
 * - Judul menyebut pembina lain → null. Judul menyebut kode LENSA → seluruh isi.
 * - Tanpa kode di judul → hanya baris yang NPP-nya binaan kode LENSA (dari kolom Pembina laporan ini
 *   atau dari laporan ITW/ITB yang pernah diimpor). Baris judul kolom tetap ikut.
 * ITW/ITB juga memperbarui daftar NPP binaan (DB.nppLensa) untuk laporan lain yang tanpa kode.
 */
function siapkanBerkasLensa(namaFile, grid) {
  var an = analisaGrid(grid, namaFile);
  if (!LAPORAN_LENSA[an.jenis]) return null;
  var kode = kodeLensa(), per = tentukanPeriode(an), peta = petakanKolom(an, grid);
  if (per.pembina && per.pembina !== kode) return null;
  if (peta.npp === undefined) return null;
  var milik = {}, adaKolom = peta.pembina !== undefined;
  for (var r = an.mulai; r < grid.length; r++) {
    var row = grid[r] || [], n = rapikanNpp(row[peta.npp]);
    if (!n) continue;
    var kd = adaKolom ? (String(row[peta.pembina] || '').toUpperCase().match(/[A-Z]{2}\d{6}/) || [''])[0] : '';
    if (per.pembina === kode || kd === kode) milik[n] = true;
  }
  if (an.jenis === 'ITW_ITB' && Object.keys(milik).length) {
    DB.nppLensa = DB.nppLensa || {};
    Object.keys(milik).forEach(function (n) { DB.nppLensa[n] = 1; });
    DB.nppLensaU = Date.now();
    tandaiUbah('lain', 'nppLensa');
  }
  var semua = per.pembina === kode, out = [], ambil = false, ada = 0;
  for (var i = 0; i < grid.length; i++) {
    var b = (grid[i] || []).map(function (x) { return x === null || x === undefined ? '' : String(x); });
    if (i < an.mulai) { out.push(b); continue; }
    var npp = rapikanNpp(b[peta.npp]);
    if (npp) ambil = semua || !!milik[npp] || (!adaKolom && !!(DB.nppLensa || {})[npp]);
    if (ambil) { out.push(b); if (npp) ada++; }
  }
  return ada ? { grid: out, jenis: an.jenis, baris: ada } : null;
}

function bukaIdb() {
  return new Promise(function (ok, gagal) {
    if (typeof indexedDB === 'undefined') return gagal(new Error('IndexedDB tidak tersedia'));
    var req = indexedDB.open(NAMA_DB, 1);
    req.onupgradeneeded = function () { req.result.createObjectStore('kv'); };
    req.onsuccess = function () { ok(req.result); };
    req.onerror = function () { gagal(req.error || new Error('IndexedDB gagal dibuka')); };
  });
}

      var tx = _idb.transaction('kv', 'readonly'), r = tx.objectStore('kv').get(KUNCI);
      r.onsuccess = function () { ok(r.result || null); };
      r.onerror = function () { gagal(r.error); };
    });
    SIMPAN.jenis = 'idb';
  } catch (e) {
    _idb = null;
    try {
      var s = localStorage.getItem(NAMA_DB);
      data = s ? JSON.parse(s) : null;
      SIMPAN.jenis = 'ls';
    } catch (e2) { SIMPAN.jenis = 'memori'; SIMPAN.galat = e2.message; }
  }
  DB = lengkapiDb(data || dbKosong());
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e3) { /* opsional */ }
  return DB;
}

/** Data dari versi lama / cadangan: lengkapi kunci yang belum ada. */
function lengkapiDb(d) {
  var k = dbKosong();
  Object.keys(k).forEach(function (x) { if (d[x] === undefined) d[x] = k[x]; });
  Object.keys(k.pengaturan).forEach(function (x) { if (d.pengaturan[x] === undefined) d.pengaturan[x] = k.pengaturan[x]; });
  if (!d.pengaturan.templatWa || !d.pengaturan.templatWa.length) d.pengaturan.templatWa = salinObj(DEF_TEMPLAT_WA);
  // templat bawaan baru (versi lebih baru) ditambahkan tanpa mengubah templat yang sudah diubah pengguna
  DEF_TEMPLAT_WA.forEach(function (t, i) {
    if (!d.pengaturan.templatWa.some(function (x) { return x.id === t.id; })) d.pengaturan.templatWa.splice(Math.min(i, d.pengaturan.templatWa.length), 0, salinObj(t));
  });
  var sk = dbKosong().sinkron;
  Object.keys(sk).forEach(function (x) { if (d.sinkron[x] === undefined) d.sinkron[x] = sk[x]; });
  d.versi = VERSI;
  return d;
}

function simpanDb(segera) {
  if (SIMPAN.tertunda) clearTimeout(SIMPAN.tertunda);
  if (segera) return tulisDb();
  SIMPAN.tertunda = setTimeout(tulisDb, 250);
}

function tulisDb() {
  SIMPAN.tertunda = null;
  return new Promise(function (ok) {
    if (SIMPAN.jenis === 'idb' && _idb) {
      try {
        var tx = _idb.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(DB, KUNCI);
        tx.oncomplete = function () { SIMPAN.terakhir = jamSekarang(); SIMPAN.galat = ''; ok(true); };
        tx.onerror = function () { SIMPAN.galat = String(tx.error && tx.error.message || 'gagal menyimpan'); ok(false); };
        return;
      } catch (e) { SIMPAN.galat = e.message; }
    }
    try {
      localStorage.setItem(NAMA_DB, JSON.stringify(DB));
      SIMPAN.jenis = 'ls'; SIMPAN.terakhir = jamSekarang(); SIMPAN.galat = '';
      ok(true);
    } catch (e2) { SIMPAN.galat = e2.message; ok(false); }
  });
}

/** Menyimpan hasil impor laporan. Laporan jenis & tanggal & pembina yang sama menggantikan yang lama. */
function terapkanImpor(namaFile, h, opsi) {
  opsi = opsi || {};
  var kunci = h.jenis + '|' + h.periode + '|' + (h.pembina || (opsi.lensa ? kodeLensa() : namaFile));
  DB.snap.forEach(function (s) { if (s.kunci === kunci) tandaiUbah('snap', s.id, true); });
  DB.snap = DB.snap.filter(function (s) { return s.kunci !== kunci; });
  var baru = { id: opsi.lensa ? 'SL' + hashTeks(kunci) : idBaru('S'), kunci: kunci, jenis: h.jenis, periode: h.periode, laporan: h.laporan || '', pembina: h.pembina || '', file: namaFile, waktu: waktuSekarang(), rows: h.rows, _u: Date.now() };
  DB.snap.push(baru);
  tandaiUbah('snap', baru.id);
  rampingkanSnap();
  DB.impor.unshift({ waktu: waktuSekarang(), file: namaFile + (opsi.lensa ? ' (dari LENSA PK)' : ''), jenis: NAMA_LAPORAN[h.jenis], ok: true, pesan: h.cek, baris: h.rows.length, total: h.total, periode: h.periode });

}

}

/** Laporan lebih tua dari 120 hari disimpan satu per bulan per jenis (yang terakhir), agar data tidak membengkak. */
function rampingkanSnap() {
  var batas = tambahHari(hariIni(), -120), maks = {};
  DB.snap.forEach(function (s) {
    if (s.periode < batas) { var k = s.jenis + '|' + (s.pembina || s.file) + '|' + s.periode.slice(0, 7); if (!maks[k] || s.periode > maks[k]) maks[k] = s.periode; }
  });
  DB.snap = DB.snap.filter(function (s) {
    return s.periode >= batas || s.periode === maks[s.jenis + '|' + (s.pembina || s.file) + '|' + s.periode.slice(0, 7)];
  });
  DB.snap.sort(function (a, b) { return a.periode < b.periode ? -1 : a.periode > b.periode ? 1 : (a.waktu < b.waktu ? -1 : 1); });
}

/* === 35-sinkron.js === */
/* ----------------------------------------------------------------------
 *  Sinkron antar-gadget lewat Google Sheet milik pengguna (Apps Script
 *  "Monitor_SPPG_Sinkron.gs", terpisah dari LENSA PK).
 *  Offline dulu: semua perubahan masuk antrean dan dikirim saat ada sinyal.
 *  Butir yang disinkron: laporan (snap), catatan kontak (log), ubahan SPPG
 *  (unit), gabung NPP (npp), laporan terkirim (lap), pengaturan & tanggal
 *  pendaftaran (lain). Konflik: perubahan terbaru (waktu ubah) yang dipakai.
 * ---------------------------------------------------------------------- */

var SINK = { jalan: false, timer: null, interval: null, setelah: null };
var PEMISAH = '\u0001';

function sinkAktif() { return !!(DB.sinkron && DB.sinkron.url && DB.sinkron.kunci); }

function tandaiUbah(t, id, hapus) {
  if (!DB.sinkron) return;
  DB.sinkron.antre[t + PEMISAH + id] = { t: t, id: id, hapus: !!hapus, ubah: Date.now() };
  if (sinkAktif()) jadwalSinkron(4000);
}

/** Semua data lokal masuk antrean (saat pertama menyambung / setelah pulihkan cadangan). Waktu ubah memakai waktu asli. */
function antreSemua() {
  var a = DB.sinkron.antre, tambah = function (t, id, u) { a[t + PEMISAH + id] = { t: t, id: id, hapus: false, ubah: u || 0 }; };
  DB.snap.forEach(function (s) { tambah('snap', s.id, s._u || 1); });
  DB.log.forEach(function (l) { tambah('log', l.id, l._u || 1); });
  Object.keys(DB.unit).forEach(function (id) { tambah('unit', id, DB.unit[id]._u || 1); });
  Object.keys(DB.nppUnit).forEach(function (n) { tambah('npp', n, (DB.nppUnitU || {})[n] || 1); });
  DB.laporan.forEach(function (l) { tambah('lap', l.id, l._u || 1); });
  tambah('lain', 'pengaturan', DB.pengaturan._u || 0);
  if (DB.daftarPer) tambah('lain', 'daftarPer', DB.daftarPerU || 1);
  if (Object.keys(DB.nppLensa || {}).length) tambah('lain', 'nppLensa', DB.nppLensaU || 1);
}

function dataLokal(t, id) {
  var cari = function (arr) { for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i]; return null; };
  if (t === 'snap') return cari(DB.snap);
  if (t === 'log') return cari(DB.log);
  if (t === 'lap') return cari(DB.laporan);
  if (t === 'unit') return DB.unit[id] || null;
  if (t === 'npp') return DB.nppUnit[id] ? { v: DB.nppUnit[id] } : null;
  if (t === 'lain' && id === 'pengaturan') return DB.pengaturan;
  if (t === 'lain' && id === 'daftarPer') return { v: DB.daftarPer };
  if (t === 'lain' && id === 'nppLensa') return { v: DB.nppLensa };
  if (t === 'keLensa') return (DB.keLensa || {})[id] || null;
  return null;
}

/** Butir dari server → data lokal. Mengembalikan true bila ada yang berubah. */
function terapkanButir(it) {
  var lok = DB.sinkron.antre[it.t + PEMISAH + it.id];
  if (lok && lok.ubah >= it.ubah) return false; // perubahan lokal lebih baru, nanti dikirim
  var id = it.id, d = it.data;
  var ganti = function (nama) {
    DB[nama] = DB[nama].filter(function (x) { return x.id !== id; });
    if (!it.hapus && d) DB[nama].push(d);
  };
  if (it.t === 'snap') {
    if (!it.hapus && d) DB.snap = DB.snap.filter(function (s) { return s.kunci !== d.kunci || s.id === id; });
    ganti('snap');
  } else if (it.t === 'log') { ganti('log'); DB.log.sort(function (a, b) { return a.waktu < b.waktu ? -1 : 1; }); }
  else if (it.t === 'lap') { ganti('laporan'); DB.laporan.sort(function (a, b) { return a.waktu < b.waktu ? -1 : 1; }); }
  else if (it.t === 'unit') { if (it.hapus || !d) delete DB.unit[id]; else DB.unit[id] = d; }
  else if (it.t === 'npp') { if (it.hapus || !d) delete DB.nppUnit[id]; else DB.nppUnit[id] = d.v; DB.nppUnitU = DB.nppUnitU || {}; DB.nppUnitU[id] = it.ubah; }
  else if (it.t === 'lain' && id === 'pengaturan' && d) { var sk = DB.sinkron; DB.pengaturan = d; DB = lengkapiDb(DB); DB.sinkron = sk; }
  else if (it.t === 'lain' && id === 'daftarPer' && d) { DB.daftarPer = d.v || ''; DB.daftarPerU = it.ubah; }
  else if (it.t === 'lain' && id === 'nppLensa' && d) { DB.nppLensa = d.v || {}; DB.nppLensaU = it.ubah; }
  else if (it.t === 'lensa') {
    DB.lensa = DB.lensa || {};
    if (it.hapus || !d) delete DB.lensa[id];
    else { if (/^berkas:/.test(id)) d._baru = true; DB.lensa[id] = d; }
  }
  else return false;
  return true;
}

async function panggilServer(isi) {
  var r = await fetch(DB.sinkron.url, {
    method: 'POST', redirect: 'follow', cache: 'no-store',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ kunci: DB.sinkron.kunci, versi: VERSI }, isi))
  });
  if (!r.ok) throw new Error('Server sinkron menjawab ' + r.status);
  var teks = await r.text(), j;
  try { j = JSON.parse(teks); } catch (e) { throw new Error(/<html/i.test(teks) ? 'Alamat sinkron salah atau web app belum diterapkan untuk "Siapa saja".' : 'Jawaban server tidak terbaca.'); }
  if (!j.ok) throw new Error(j.galat || 'Sinkron gagal');
  return j;
}

function jadwalSinkron(jeda) {
  clearTimeout(SINK.timer);
  SINK.timer = setTimeout(function () { sinkronkan(); }, jeda || 0);
}

/** Satu putaran: kirim antrean, lalu tarik perubahan dari server. */
async function sinkronkan(opsi) {
  opsi = opsi || {};
  if (!sinkAktif()) return { ok: false };
  if (SINK.jalan) { SINK.ulang = true; return { ok: false }; }
  var sk = DB.sinkron;
  if (typeof navigator !== 'undefined' && navigator.onLine === false) { sk.status = 'offline'; if (typeof renderNav === 'function') renderNav(); return { ok: false }; }
  SINK.jalan = true; sk.status = 'jalan';
  if (typeof renderNav === 'function') renderNav();
  var berubah = false, terkirim = 0, diterima = 0, lensaMasuk = 0;
  try {
    // 1. kirim antrean (bertahap ±1,5 MB)
    var kunci = Object.keys(sk.antre), batch = [], ukuran = 0;
    var kirim = async function () {
      if (!batch.length) return;
      var j = await panggilServer({ aksi: 'dorong', item: batch });
      batch.forEach(function (it) {
        var k = it.t + PEMISAH + it.id;
        if (sk.antre[k] && sk.antre[k].ubah === it.ubah) { delete sk.antre[k]; if (it.t === 'keLensa') delete DB.keLensa[it.id]; }
      });
      terkirim += batch.length;
      if (j.seq && j.seq === sk.seq + batch.length) sk.seq = j.seq; // tidak ada perubahan lain di server sejak tarikan terakhir
      batch = []; ukuran = 0;
    };
    for (var i = 0; i < kunci.length; i++) {
      var a = sk.antre[kunci[i]];
      if (!a) continue;
      var d = a.hapus ? null : dataLokal(a.t, a.id);
      var it = { t: a.t, id: a.id, ubah: a.ubah, hapus: a.hapus || !d, data: d };
      var n = JSON.stringify(it).length;
      if (ukuran + n > 1500000 && batch.length) await kirim();
      batch.push(it); ukuran += n;
    }
    await kirim();
    // 2. tarik perubahan sejak seq terakhir (bertahap)
    var lagi = true, putaran = 0;
    while (lagi && putaran < 200) {
      putaran++;
      var t = await panggilServer({ aksi: 'tarik', sejak: sk.seq, lensa: putaran === 1 ? (opsi.lensa ? 'segera' : 'auto') : '' });
      if (t.lensa && t.lensa.masuk) lensaMasuk += t.lensa.masuk;
      (t.item || []).forEach(function (it) { if (terapkanButir(it)) { berubah = true; diterima++; } });
      if (t.lensa) sk.lensa = t.lensa;
      sk.seq = t.seq;
      lagi = !!t.lagi;
    }
    if (prosesBerkasLensa()) berubah = true;
    if (berubah) rampingkanSnap();
    if (lensaAktif() && sk.lensa.sejak && DB.lensaSejak !== sk.lensa.sejak) { DB.lensaSejak = sk.lensa.sejak; kirimPicAwalKeLensa(); }
    sk.terakhir = waktuSekarang(); sk.galat = ''; sk.status = 'ok';
    await simpanDb(true);
  } catch (e) {
    sk.galat = e.message; sk.status = 'galat';
    simpanDb();
  } finally {
    SINK.jalan = false;
  }
  if (berubah && typeof setelahSinkron === 'function') setelahSinkron();
  else if (typeof renderNav === 'function') renderNav();
  if (SINK.ulang) { SINK.ulang = false; jadwalSinkron(500); }
  return { ok: !sk.galat, terkirim: terkirim, diterima: diterima, galat: sk.galat, lensaMasuk: lensaMasuk, lensa: lensaAktif() };
}

/** Kode sambung = alamat + kunci, untuk ditempel di gadget lain. */
function buatKodeSambung() { return 'MSPPG1.' + btoa(unescape(encodeURIComponent(JSON.stringify({ u: DB.sinkron.url, k: DB.sinkron.kunci })))); }
function bacaKodeSambung(kode) {
  var m = String(kode || '').trim().match(/^MSPPG1\.(.+)$/);
  if (!m) return null;
  try { var o = JSON.parse(decodeURIComponent(escape(atob(m[1])))); return o.u && o.k ? { url: o.u, kunci: o.k } : null; } catch (e) { return null; }
}

function cekAlamatSinkron(url) {
  return /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_\-]+\/exec$/.test(String(url || '').trim());
}

async function sambungSinkron(url, kunci) {
  url = String(url || '').trim(); kunci = String(kunci || '').trim();
  if (!cekAlamatSinkron(url)) throw new Error('Alamat web app harus seperti https://script.google.com/macros/s/…/exec');
  if (kunci.length < 16) throw new Error('Kunci sinkron terlalu pendek. Salin dari jendela "siapkan" di Apps Script.');
  var lama = { url: DB.sinkron.url, kunci: DB.sinkron.kunci };
  DB.sinkron.url = url; DB.sinkron.kunci = kunci;
  try { await panggilServer({ aksi: 'cek' }); }
  catch (e) { DB.sinkron.url = lama.url; DB.sinkron.kunci = lama.kunci; throw e; }
  DB.sinkron.seq = 0; DB.sinkron.galat = '';
  antreSemua();
  await simpanDb(true);
  return sinkronkan();
}

function putusSinkron() {
  DB.sinkron = { url: '', kunci: '', seq: 0, antre: {}, terakhir: '', galat: '', status: '' };
  simpanDb(true);
}

function mulaiSinkronOtomatis() {
  if (typeof window === 'undefined') return;
  window.addEventListener('online', function () { jadwalSinkron(1000); });
  window.addEventListener('offline', function () { if (DB.sinkron) { DB.sinkron.status = 'offline'; renderNav(); } });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && sinkAktif()) jadwalSinkron(800); });
  SINK.interval = setInterval(function () { if (sinkAktif() && !document.hidden) sinkronkan(); }, 120000);
  if (sinkAktif()) jadwalSinkron(600);
}

/* ---------------- LENSA PK (lewat server sinkron) ---------------- */

function lensaAktif() { return sinkAktif() && !!(DB.sinkron.lensa && DB.sinkron.lensa.aktif); }
function kodeLensa() { return String((DB.lensa && DB.lensa.info && DB.lensa.info.kode) || DB.pengaturan.kodeLensa || 'HA187580').toUpperCase(); }

/** Titipan untuk LENSA PK (dikirim bersama antrean sinkron; server meneruskan ke tab KE_LENSA). */
function kirimKeLensa(jenis, data) {
  if (!lensaAktif()) return false;
  var id = jenis + ':' + idBaru('');
  DB.keLensa = DB.keLensa || {};
  DB.keLensa[id] = Object.assign({ jenis: jenis }, data);
  tandaiUbah('keLensa', id);
  return true;
}

function kirimPicKeLensa(u) {

/** Laporan kiriman LENSA (baris SPPG binaan) diimpor di gadget ini. */
function prosesBerkasLensa() {
  var ids = Object.keys(DB.lensa || {}).filter(function (k) { return /^berkas:/.test(k) && DB.lensa[k] && DB.lensa[k]._baru && DB.lensa[k].grid; });
  if (!ids.length) return false;
  ids.sort(function (a, b) { var p = function (k) { return DB.lensa[k].laporan === 'ITW_ITB' ? 1 : 0; }; return (p(a) - p(b)) || (DB.lensa[a].waktu < DB.lensa[b].waktu ? -1 : 1); });
  var dikenal = {};
  Object.keys(DB.nppUnit).forEach(function (n) { dikenal[n] = true; });
  DB.snap.forEach(function (s) { (s.rows || []).forEach(function (r) { dikenal[r.npp] = true; }); });
  var ada = false;
  ids.forEach(function (k) {
    var d = DB.lensa[k], nama = String(d.nama || 'laporan LENSA');
    try {
      var h = uraiLaporan(nama, d.grid, dikenal);
      if (!h.rows.length) throw new Error('tidak ada baris SPPG');
      h.rows.forEach(function (r) { dikenal[r.npp] = true; });
      terapkanImpor(nama, h, { lensa: true });
      ada = true;
      d.hasil = '✓ ' + NAMA_LAPORAN[h.jenis] + ' per ' + tglSedang(h.periode);
    } catch (e) {
      catatImporGagal(nama + ' (dari LENSA PK)', e.message);
      d.hasil = '✗ ' + e.message;
    }
    delete d.grid; delete d._baru; // isi laporan tidak disimpan dua kali
  });
  return ada;
}

/* ----------------------------------------------------------------------

var WARNA = {

/** Kunci kategori dari koef & ITB. */
function kunciKat(itb, koef) { return itb ? 'tepat' : koef <= 1 ? 'lalu' : 'm' + koef; }

  var bulanIni = blthDariIdx(M0);

}

/** Rekaman terbaru per NPP dari semua laporan sejenis (laporan per pembina digabung). */
function terbaruPerNpp(jenis, sampai) {

  DB.snap.forEach(function (s) {

/**

function hitung(opsi) {
  opsi = opsi || {};

  Object.keys(mon).forEach(function (n) { if (mon[n].bp || mon[n].na) semuaNpp[n] = true; });

    } else {

    }

    // Sama dengan LENSA PK: tanda ITW/ITB dari laporan dipakai apa adanya (agar cocok dengan rekap kantor);
    // bila angka digeser (laporan bulan lalu / bayar baru dari Monitoring), dihitung ulang dari rumus.
    var itb = geser || !a.itb ? bln <= 0 : a.itb === 'Y';

    // bulan menunggak untuk kategori: koefisien; bila sistem menyatakan tidak ITW padahal koef ≤ 1 (IBR), pakai bulan belum posting
    var n = itb ? 0 : itwY ? Math.min(koef, 1) : (koef >= 2 ? koef : Math.max(2, bln));

      itwBeda: !!(a && a.itw && !geser && (a.itw === 'Y') !== (koef <= 1)),
      ibrN: a ? a.ibrN : 0, ibrB: ibrB, iuran: iuran, tunggakan: Math.max(0, koef - 1) * iuran, tagihan: Math.max(0, koef) * iuran,
      tgl: m && m.tgl ? m.tgl : '', tk: m ? m.tk : 0, prog: m ? m.prog : '', keps: m ? m.keps : '', skala: m ? m.skala : '',
      pembina: (a && a.pembina) || (a && a._pembina) || '', periode: periode, sumber: sumber, kodeIuran: kodeIuran(n_npp),

    // tagihan = rumus Rincian Tagihan LENSA PK (iuran + denda − IBR), sama di gambar, pesan WA, dan daftar
    o.rinci = rincianNpp(o, { M0: M0 });
    o.tagihan = o.rinci ? o.rinci.totalTagihan : 0;

    npps.push(o);
    if (!periodeMaks || periode > periodeMaks) periodeMaks = periode;

  });

  /* ---- kelompokkan per SPPG ---- */
  var unitMap = {};
  npps.forEach(function (o) {

    var u = unitMap[id];
    if (!u) {
      var ur = uraiNamaSppg(o.inti);

    }

  });

  // catatan dari LENSA PK hanya membawa NPP: SPPG-nya dicari lewat NPP
  var nppKeUnit = {};
  Object.keys(unitMap).forEach(function (id) { unitMap[id].npps.forEach(function (o) { nppKeUnit[o.npp] = id; }); });
  var logPerUnit = {};
  DB.log.forEach(function (l) {
    var k = l.unit;
    if (!k || (!unitMap[k] && !(DB.unit[k] && DB.unit[k].manual))) {
      for (var i = 0; i < (l.npp || []).length; i++) if (nppKeUnit[l.npp[i]]) { k = nppKeUnit[l.npp[i]]; break; }
    }
    if (k) (logPerUnit[k] = logPerUnit[k] || []).push(l);
  });

  var units = Object.keys(unitMap).map(function (id) {
    var u = unitMap[id], ub = DB.unit[id] || {};
    u.npps.sort(function (a, b) { var r = { Pengurus: 0, Relawan: 1 }; return ((r[a.jenis] === undefined ? 2 : r[a.jenis]) - (r[b.jenis] === undefined ? 2 : r[b.jenis])) || (a.npp < b.npp ? -1 : 1); });
    u.label = ub.nama || u.otomatis.label;
    u.yayasan = ub.yayasan !== undefined ? String(ub.yayasan).trim() : u.otomatis.yayasan;
    u.kecamatan = ub.kecamatan || u.otomatis.kecamatan;
    u.desa = ub.desa || '';
    u.namaResmi = u.npps[0].inti;
    u.koef = Math.max.apply(null, u.npps.map(function (x) { return x.n; }));
    u.bln = Math.max.apply(null, u.npps.map(function (x) { return x.bln; }));
    u.itb = u.npps.every(function (x) { return x.itb; });
    u.itw = u.npps.every(function (x) { return x.itw; });
    u.kategori = kunciKat(u.itb, u.koef);
    u.tunggakan = u.npps.reduce(function (s, x) { return s + x.tunggakan; }, 0);
    u.tagihan = u.npps.reduce(function (s, x) { return s + x.tagihan; }, 0);
    u.iuran = u.npps.reduce(function (s, x) { return s + x.iuran; }, 0);
    u.tk = u.npps.reduce(function (s, x) { return s + (x.tk || 0); }, 0);
    u.ibr = u.npps.some(function (x) { return x.ibrB > 0 && x.bln > 0; });
    u.tglBayar = u.itb ? u.npps.reduce(function (t, x) { return x.tgl && x.tgl > t ? x.tgl : t; }, '') : '';
    u.keps = u.npps.reduce(function (t, x) { return x.keps && (!t || x.keps < t) ? x.keps : t; }, '');
    u.pembina = u.npps.map(function (x) { return x.pembina; }).filter(function (v, i, a) { return v && a.indexOf(v) === i; }).join(', ');
    u.periode = u.npps.reduce(function (t, x) { return x.periode < t ? x.periode : t; }, u.npps[0].periode);
    u.status = 'Terdaftar aktif';
    u.catatan = ub.catatan || '';
    // PIC: yang terakhir diubah antara isian manual dan PIC LENSA PK (sinkron) > rekap pendaftaran > STATUS_PK LENSA > Data Badan Usaha
    var pic = { nama: ub.picNama || '', wa: ub.picWa || '', sumber: ub.picNama || ub.picWa ? 'manual' : '' };
    var waktuManual = ub.picNama || ub.picWa ? (ub.picU || ub._u || 0) : -1, picL = null;
    u.npps.forEach(function (x) { var d = (DB.lensa || {})['pic:' + x.npp]; if (d && d.nama && (!picL || (+d.u || 0) > (+picL.u || 0))) picL = d; });
    if (picL && (+picL.u || 0) > waktuManual) {
      pic = { nama: judulNama(picL.nama), wa: picL.wa || '', sumber: 'LENSA PK' };
      if (picL.sapaan && !(ub.sapaan && (ub.picU || ub._u || 0) >= (+picL.u || 0))) ub = Object.assign({}, ub, { sapaan: picL.sapaan });
    }
    if (!pic.nama || !pic.wa) {
      u.npps.forEach(function (x) {
        [[x.kontakLensa, 'LENSA PK'], [x.kontakDbu, 'Data BU']].forEach(function (p) {
          var k = p[0];
          if (!k) return;
          if (!pic.nama && k.nama) { pic.nama = judulNama(k.nama); pic.sumber = pic.sumber || p[1]; }
          if (!pic.wa && hpSeluler(k.hp)) pic.wa = k.hp;
        });
      });
    }
    u.pic = { nama: pic.nama, wa: hpSeluler(pic.wa), waTampil: hpTampil(pic.wa), sumber: pic.sumber };
    u.sapaan = ub.sapaan || '';
    var logs = (logPerUnit[id] || []).slice().sort(function (a, b) { return a.waktu < b.waktu ? 1 : -1; });
    u.log = logs;
    u.kontakTerakhir = logs[0] || null;
    var janji = logs.filter(function (l) { return l.janji; })[0];
    u.janji = janji && !u.itb ? janji.janji : '';
    u.bayarSetelahWa = logs.some(function (l) { return l.koefSaat !== null && l.koefSaat !== undefined && u.koef < l.koefSaat; });
    u.kunciYys = kunciYayasan(u.yayasan);
